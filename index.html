<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT Vocab — Answer Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --form:#dde4db;      /* pale mint form stock */
  --sheet:#f7f8f4;     /* printed area */
  --ink:#16181a;
  --ink-2:#5c6360;
  --graphite:#3b4146;  /* pencil fill */
  --rule:#c2ccc0;
  --rule-2:#e0e5dd;
  --red:#b8342a;       /* grading pen */
  --green:#20674a;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(20px,4vw,46px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--form);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding:clamp(12px,3vw,40px);
  display:flex;justify-content:center;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
ol,ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:2px solid var(--graphite);outline-offset:3px}

/* ---------- sheet ---------- */
.sheet{
  width:100%;max-width:820px;background:var(--sheet);
  border:1px solid var(--rule);
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 18px 44px -30px rgba(20,30,24,.5);
}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:22px var(--pad) 16px;border-bottom:2px solid var(--ink);
}
.masthead h1{
  font-family:var(--mono);font-size:13px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;margin:0;
}
.masthead .sub{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-2);
}
.masthead .sub b{font-weight:500;color:var(--ink)}

/* ---------- mode tabs ---------- */
.modes{display:flex;border-bottom:1px solid var(--rule);background:#eef1ea}
.modes button{
  flex:1;padding:13px 8px;font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
  border-right:1px solid var(--rule);transition:background .15s,color .15s;
}
.modes button:last-child{border-right:none}
.modes button:hover{background:#e6eae2;color:var(--ink)}
.modes button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.modes .sm{display:none}

/* ---------- two-column body ---------- */
.body{display:grid;grid-template-columns:52px 1fr}
.gutter{
  border-right:1px solid var(--rule);background:#eef1ea;
  padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:5px;
}
.gutter .glabel{
  font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--ink-2);
  writing-mode:vertical-rl;margin-bottom:8px;text-transform:uppercase;
}
.tick{width:16px;height:5px;background:#d7ded5;border-radius:1px}
.tick.hit{background:var(--graphite)}
.tick.miss{background:var(--red)}
.tick.save{background:var(--red);box-shadow:inset 0 0 0 1px var(--sheet)}

.form{padding:26px var(--pad) var(--pad)}

/* ---------- question head ---------- */
.qhead{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);padding-bottom:12px;border-bottom:1px solid var(--rule-2);
}
.qhead .qno{color:var(--ink);font-weight:500}
.qhead .tally b{color:var(--ink);font-weight:500}

/* extra lives, drawn as spare filled bubbles */
.lives{display:inline-flex;align-items:center;gap:4px;margin-left:10px;vertical-align:-1px}
.lives i{
  width:13px;height:10px;border-radius:50%;display:inline-block;
  background:radial-gradient(ellipse at 38% 34%,#5a6167 0%,#333a3f 55%,#22282c 100%);
}
.lives i.spare{background:none;border:1.2px solid var(--rule)}
.lives.pop i:last-of-type{animation:pop .42s cubic-bezier(.34,1.5,.64,1)}
@keyframes pop{0%{transform:scale(0) rotate(-14deg)}100%{transform:scale(1) rotate(0)}}

/* ---------- prompt ---------- */
.ask{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);margin:26px 0 12px;
}
.prompt{margin:0 0 30px;font-size:clamp(20px,3.1vw,26px);line-height:1.42;font-weight:400}
.prompt .pos{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-2);
  text-transform:lowercase;margin-right:.5em;vertical-align:.18em;
}
.prompt .gap{
  border-bottom:2px solid var(--ink);padding:0 .12em;white-space:nowrap;
}
.prompt .gap.filled{border-bottom-color:var(--green);color:var(--green);font-weight:600}

/* ---------- bubble rows ---------- */
.options{border-top:1px solid var(--rule-2)}
.opt{border-bottom:1px solid var(--rule-2)}
.opt > button{
  width:100%;display:flex;align-items:flex-start;gap:16px;
  padding:15px 6px 15px 2px;text-align:left;transition:background .14s;
}
.opt > button:hover:not(:disabled){background:#eef1ea}
.opt > button:disabled{cursor:default}

.bubble{
  flex:none;width:30px;height:22px;margin-top:2px;border:1.6px solid var(--graphite);
  border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--graphite);
  transition:color .18s;
}
.bubble::after{
  content:"";position:absolute;inset:-2px;border-radius:50%;
  background:radial-gradient(ellipse at 38% 34%,#5a6167 0%,#333a3f 55%,#22282c 100%);
  transform:scale(0) rotate(-8deg);transition:transform .2s cubic-bezier(.34,1.4,.64,1);
}
.opt.marked .bubble::after{transform:scale(1) rotate(-8deg)}
.opt.marked .bubble{color:#eef1ea}
.bubble span{position:relative;z-index:1}

.word{font-size:19px;font-weight:500;letter-spacing:.005em;line-height:1.35;flex:1}
.gloss{
  display:block;font-size:14.5px;line-height:1.5;color:var(--ink-2);font-weight:400;
  text-decoration:none;
  margin-top:5px;max-height:0;opacity:0;overflow:hidden;
  transition:max-height .3s ease,opacity .25s ease .05s;
}
.revealed .gloss{max-height:240px;opacity:1}

.stamp{
  flex:none;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;
  padding:3px 7px;margin-top:4px;opacity:0;transition:opacity .2s;
}
.revealed .stamp{opacity:1}
.opt.key .stamp{color:var(--green);border:1px solid var(--green)}
.opt.slip .stamp{color:var(--red);border:1px solid var(--red)}
.opt.key .term{color:var(--green)}
.opt.slip .term{color:var(--red);text-decoration:line-through;text-decoration-color:rgba(184,52,42,.5)}

/* ---------- verdict + next ---------- */
.foot{display:none;margin-top:26px;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.foot.on{display:flex}
.verdict{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.verdict.right{color:var(--green)}
.verdict.wrong{color:var(--red)}
.verdict.held{color:var(--graphite)}
.verdict small{display:block;font-family:var(--serif);font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-2);margin-top:6px}
.verdict small b{color:var(--ink);font-weight:600}
.next{
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  padding:11px 20px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);
  transition:background .15s,color .15s;
}
.next:hover{background:transparent;color:var(--ink)}
.next kbd{font:inherit;opacity:.6;margin-left:8px}

/* ---------- key binding panel ---------- */
.panel{
  margin-top:26px;border:1px solid var(--rule);background:#eef1ea;padding:18px 20px 16px;
}
.panel[hidden]{display:none}
.panel h4{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;margin:0 0 14px;color:var(--ink-2);
}
.binds{display:flex;gap:10px;flex-wrap:wrap}
.binds button{
  display:flex;align-items:center;gap:10px;padding:8px 12px 8px 9px;
  border:1px solid var(--rule);background:var(--sheet);transition:border-color .15s,background .15s;
}
.binds button:hover{border-color:var(--graphite)}
.binds button.listening{border-color:var(--red);background:#fff}
.binds .slot{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);
}
.binds .cap{
  font-family:var(--mono);font-size:12px;font-weight:600;min-width:26px;text-align:center;
  border-bottom:1.5px solid var(--graphite);padding-bottom:1px;
}
.binds button.listening .cap{color:var(--red);border-bottom-color:var(--red)}
.pnote{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin:14px 0 0;max-width:56ch}
.pnote button{text-decoration:underline;text-underline-offset:3px}
.pnote button:hover{color:var(--ink)}
.warn{color:var(--red)}

.hint{
  margin-top:22px;padding-top:14px;border-top:1px solid var(--rule-2);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);
  display:flex;gap:18px;flex-wrap:wrap;
}
.hint button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.hint button:hover{color:var(--ink)}

@media (max-width:620px){
  body{padding:0}
  .sheet{border:none;box-shadow:none;min-height:100vh}
  .body{grid-template-columns:1fr}
  .gutter{
    flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:4px;
    border-right:none;border-bottom:1px solid var(--rule);padding:12px var(--pad);
  }
  .gutter .glabel{writing-mode:horizontal-tb;margin:0 8px 0 0}
  .tick{width:5px;height:14px}
  .word{font-size:17.5px}
  .modes .lg{display:none}
  .modes .sm{display:inline}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>

    </main>
  </div>
</div>

ly man slept on the floor, took only cold showers, and generally followed other practices of  ____ .","f":"abnegation"},{"w":"abort","p":"v.","d":"(v.) to give up on a half-finished project or effort","s":"After they ran out of food, the men, attempting to jump rope around the world, had to  ____  and go home.","f":"abort"},{"w":"abridge","p":"v.","d":"(v.) to cut down, shorten · (adj.) shortened","s":"The publisher thought the dictionary was too long and  ____  it.","f":"abridged"},{"w":"abrogate","p":"v.","d":"(v.) to abolish, usually by authority","s":"The Bill of Rights assures that the government cannot  ____  our right to a free press.","f":"abrogate"},{"w":"abscond","p":"v.","d":"(v.) to sneak away and hide","s":"In the confusion, the super-spy  ____  into the night with the secret plans.","f":"absconded"},{"w":"absolution","p":"n.","d":"(n.) freedom from blame, guilt, sin","s":"Once all the facts were known, the jury gave Angela  ____  by giving a verdict of not guilty.","f":"absolution"},{"w":"abstain","p":"v.","d":"(v.) to freely choose not to commit an action","s":"Everyone demanded that Angus put on the kilt, but he did not want to do it and  ____ .","f":"abstained"},{"w":"abstruse","p":"adj.","d":"(adj.) hard to comprehend","s":"Everyone else in the class understood geometry easily, but John found the subject  ____ .","f":"abstruse"},{"w":"accede","p":"v.","d":"(v.) to agree","s":"When the class asked the teacher whether they could play baseball instead of learn grammar they expected him to refuse, but instead he  ____  to their request.","f":"acceded"},{"w":"accentuate","p":"v.","d":"(v.) to stress, highlight","s":"Psychologists agree that those people who are happiest  ____  the positive in life.","f":"accentuate"},{"w":"accessible","p":"adj.","d":"(adj.) obtainable, reachable","s":"After studying with SparkNotes and getting a great score on the SAT, Marlena happily realized that her goal of getting into an Ivy-League college was  ____ .","f":"accessible"},{"w":"acclaim","p":"n.","d":"(n.) high praise","s":"Greg's excellent poem won the  ____  of his friends.","f":"acclaim"},{"w":"accolade","p":"n.","d":"(n.) high praise, special distinction","s":"Everyone offered  ____  to Sam after he won the Noble Prize.","f":"accolades"},{"w":"accommodating","p":"adj.","d":"(adj.) helpful, obliging, polite","s":"Though the apartment was not big enough for three people, Arnold, Mark, and Zebulon were all friends and were  ____  to each other.","f":"accommodating"},{"w":"accord","p":"n.","d":"(n.) an agreement","s":"After much negotiating, England and Iceland finally came to a mutually beneficial  ____  about fishing rights off the cost of Greenland.","f":"accord"},{"w":"accost","p":"v.","d":"(v.) to confront verbally","s":"Though Antoinette was normally quite calm, when the waiter spilled soup on her for the fourth time in 15 minutes she stood up and  ____  the man.","f":"accosted"},{"w":"accretion","p":"n.","d":"(n.) slow growth in size or amount","s":"Stalactites are formed by the  ____  of minerals from the roofs of caves.","f":"accretion"},{"w":"acerbic","p":"adj.","d":"(adj.) biting, bitter in tone or taste","s":"Jill became extremely  ____  and began to cruelly make fun of all her friends.","f":"acerbic"},{"w":"acquiesce","p":"v.","d":"(v.) to agree without protesting","s":"Though Mr. Correlli wanted to stay outside and work in his garage, when his wife told him that he had better come in to dinner, he  ____  to her demands.","f":"acquiesced"},{"w":"acrimonious","p":"adj.","d":"(adj.) angry and bitter in speech or tone"},{"w":"acrimony","p":"n.","d":"(n.) bitterness, discord","s":"Though they vowed that no girl would ever come between them, Biff and Trevor could not keep  ____  from overwhelming their friendship after they both fell in love with the lovely Teresa.","f":"acrimony"},{"w":"acumen","p":"n.","d":"(n.) keen insight","s":"Because of his mathematical  ____ , Larry was able to figure out in minutes problems that :"Jack ran away as soon as his father found out, knowing he would be  ____  for his unseemly behavior.","f":"vituperated"},{"w":"vituperative","p":"adj.","d":"(adj.) bitter and abusive in language"},{"w":"vivacious","p":"adj.","d":"(adj.) lively, sprightly","s":"The  ____  clown makes all of the children laugh and giggle with his friendly antics.","f":"vivacious"},{"w":"vocation","p":"n.","d":"(n.) the work in which someone is employed, profession","s":"After growing tired of the superficial world of high-fashion, Edwina decided to devote herself to a new  ____ : social work.","f":"vocation"},{"w":"vociferous","p":"adj.","d":"(adj.) loud, boisterous","s":"I'm tired of his  ____  whining so I'm breaking up with him.","f":"vociferous"},{"w":"volatile","p":"adj.","d":"(adj.) likely to change suddenly and unpredictably"},{"w":"voracious","p":"adj.","d":"(adj.) wanting or devouring great quantities of something"},{"w":"wallow","p":"v.","d":"(v.) to roll oneself indolently; to become or remain helpless","s":"My roommate can't get over her breakup with her boyfriend and now just  ____  in self-pity.","f":"wallows"},{"w":"wane","p":"v.","d":"(v.) to decrease in size, dwindle","s":"Don't be so afraid of his wrath because his influence with the president is already beginning to  ____ .","f":"wane"},{"w":"wanton","p":"adj.","d":"(adj.) undisciplined, lewd, lustful","s":"Vicky's  ____  demeanor often made the frat guys next door very excited.","f":"wanton"},{"w":"wary","p":"n.","d":"(n.) cautious"},{"w":"whereas","p":"adj.","d":"(adj.) in contrast between two things"},{"w":"whimsical","p":"adj.","d":"(adj.) fanciful, full of whims","s":"The  ____  little girl liked to pretend that she was an elvin princess.","f":"whimsical"},{"w":"wily","p":"adj.","d":"(adj.) crafty, sly","s":"Though they were not the strongest of the Thundercats,  ____  Kit and Kat were definitely the most clever and full of tricks.","f":"wily"},{"w":"winsome","p":"adj.","d":"(adj.) charming, pleasing","s":"Af const BY_WORD = Object.fromEntries(WORDS.map(w => [w.w, w]));
const WITH_EX = WORDS.filter(w => w.s);
document.getElementById('bank').textContent = WORDS.length.toLocaleString();
document.getElementById('bankEx').textContent = WITH_EX.length.toLocaleString();

const LIFE_EVERY = 7;                       // a correct run this long earns one extra life
const DEFAULT_KEYS = ['a', 'b', 'c', 'd'];
const RESERVED = ['enter', ' ', 'escape', 'tab', 'shift', 'control', 'alt', 'meta'];

/* ---------- helpers ---------- */
const rnd  = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* Content words of a definition, used to keep near-synonyms out of the options. */
const KEY_CACHE = new Map();
function keyWords(def) {
  if (!KEY_CACHE.has(def)) {
    const stop = new Set(['that','with','from','this','they','than','such','have','been','into','very','some','something','someone','being','which','about','other','more','used','usually']);
    KEY_CACHE.set(def, new Set((def.toLowerCase().match(/[a-z]{4,}/g) || []).filter(w => !stop.has(w))));
  }
  return KEY_CACHE.get(def);
}
function tooSimilar(a, b) {
  const A = keyWords(a.d), B = keyWords(b.d);
  if (!A.size || !B.size) return false;
  let hits = 0;
  for (const w of A) if (B.has(w)) hits++;
  return hits / Math.min(A.size, B.size) > 0.45;
}

/* Same part of speech keeps grammar from giving the answer away. */
const BY_POS = {};
for (const w of WORDS) (BY_POS[w.p] ||= []).push(w);

/* ---------- persistence: artifact storage, then localStorage, then memory ---------- */
const Store = (() => {
  const KEY = 'sat-vocab-session-v1';
  let mem = null;
  const ws = () => (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') ? window.storage : null;
  return {
    async load() {
      try {
        const s = ws();
        if (s) { const r = await s.get(KEY); return r ? JSON.parse(r.value) : null; }
        const v = localStorage.getItem(KEY);
        return v ? JSON.parse(v) : null;
      } catch (e) { return mem; }
    },
    async save(obj) {
      mem = obj;
      try {
        const s = ws();
        if (s) { await s.set(KEY, JSON.stringify(obj)); return; }
        localStorage.setItem(KEY, JSON.stringify(obj));
      } catch (e) { /* private mode or a sandbox with no storage — session stays in memory */ }
    },
    async clear() {
      mem = null;
      try {
        const s = ws();
        if (s) { await s.delete(KEY); return; }
        localStorage.removeItem(KEY);
      } catch (e) {}
    }
  };
})();

/* ---------- session state ---------- */
let mode = 'def', seen = 0, right = 0, streak = 0, lives = 0, earned = 0;
let marks = [], keys = DEFAULT_KEYS.slice();
let decks = { def: [], cloze: [] }, q = null, locked = false, listening = -1, justEarned = false;

const persist = () => Store.save({ mode, seen, right, streak, lives, earned, marks, keys });

function newDeck(kind) { decks[kind] = shuffle((kind === 'cloze' ? WITH_EX : WORDS).slice()); }

function build(kind) {
  if (!decks[kind].length) newDeck(kind);
  const answer = decks[kind].pop();

  const pool = (BY_POS[answer.p] || []).length >= 24 ? BY_POS[answer.p] : WORDS;
  const foils = [];
  const usable = c =>
    c.w !== answer.w && !foils.some(f => f.w === c.w) && !tooSimilar(c, answer) &&
    !(kind === 'cloze' && answer.s.toLowerCase().includes(c.w.toLowerCase().slice(0, 5)));

  // the word this one is most often confused with makes the best distractor there is
  if (answer.nm && BY_WORD[answer.nm] && usable(BY_WORD[answer.nm])) foils.push(BY_WORD[answer.nm]);

  for (let tries = 0; foils.length < 3 && tries < 240; tries++) {
    const c = pick(pool);
    if (usable(c)) foils.push(c);
  }
  while (foils.length < 3) {                       // safety net, never fires in practice
    const c = pick(WORDS);
    if (c.w !== answer.w && !foils.some(f => f.w === c.w)) foils.push(c);
  }
  return { kind, answer, options: shuffle([answer, ...foils]) };
}

/* ---------- render ---------- */
function render() {
  locked = false;
  const kind = mode === 'mixed' ? (Math.random() < 0.5 ? 'def' : 'cloze') : mode;
  q = build(kind);

  document.getElementById('qno').textContent = 'Question ' + String(seen + 1).padStart(3, '0');
  document.getElementById('ask').textContent = kind === 'def' ? 'Which word means' : 'Which word fills the blank';

  const prompt = document.getElementById('prompt');
  if (kind === 'def') {
    const first = q.answer.d.split(' · ')[0].replace(/^\(([^)]+)\)\s*/, '');
    prompt.innerHTML = '<span class="pos">' + esc(q.answer.p) + '</span>' + esc(first);
  } else {
    prompt.innerHTML = esc(q.answer.s).replace(/\u2003____\u2003/, '<span class="gap" id="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  }

  const list = document.getElementById('options');
  list.innerHTML = '';
  q.options.forEach((o, i) => {
    const li = document.createElement('li');
    li.className = 'opt';
    li.innerHTML =
      '<button type="button" aria-label="' + esc(o.w) + '">' +
        '<span class="bubble"><span>' + esc(keys[i].toUpperCase()) + '</span></span>' +
        '<span class="word"><span class="term">' + esc(o.w) + '</span><span class="gloss">' + esc(o.d) + '</span></span>' +
        '<span class="stamp"></span>' +
      '</button>';
    li.querySelector('button').addEventListener('click', () => answer(i));
    list.appendChild(li);
  });

  document.getElementById('foot').classList.remove('on');
  document.getElementById('prompt').scrollIntoView({ block: 'nearest' });
}

function answer(i) {
  if (locked) return;
  locked = true;

  const chosen = q.options[i];
  const correct = chosen.w === q.answer.w;
  let saved = false;
  justEarned = false;

  seen++;
  if (correct) {
    right++; streak++;
    while (streak >= (earned + 1) * LIFE_EVERY) { earned++; lives++; justEarned = true; }
  } else if (lives > 0) {
    lives--; saved = true;                         // spend a life, the run survives
  } else {
    streak = 0; earned = 0;                        // run is over, the next life is 7 away again
  }
  marks.push(correct ? 'hit' : saved ? 'save' : 'miss');
  if (marks.length > 20) marks.shift();

  document.querySelectorAll('.opt').forEach((li, n) => {
    li.classList.add('revealed');
    li.querySelector('button').disabled = true;
    if (n === i) li.classList.add('marked');
    const isKey = q.options[n].w === q.answer.w;
    if (isKey) { li.classList.add('key'); li.querySelector('.stamp').textContent = n === i ? 'Your answer · correct' : 'Correct'; }
    else if (n === i) { li.classList.add('slip'); li.querySelector('.stamp').textContent = 'Your answer'; }
  });

  if (q.kind === 'cloze') {
    const gap = document.getElementById('gap');
    if (gap) { gap.textContent = q.answer.f; gap.classList.add('filled'); }
  }

  const v = document.getElementById('verdict');
  v.className = 'verdict ' + (correct ? 'right' : saved ? 'held' : 'wrong');
  let note = correct ? '' : '<b>The answer was ' + esc(q.answer.w) + '.</b> ';
  if (saved) note += 'Extra life spent — your streak holds at <b>' + streak + '</b>, with <b>' + lives + '</b> left. ';
  if (justEarned) note += 'Streak of <b>' + streak + '</b> — extra life earned. ';
  if (q.kind === 'def') {                          // the example is the one thing not already on screen
    const [before, after] = (q.answer.s || '').split('\u2003____\u2003');
    if (after !== undefined) note += '<i>' + esc(before) + '<b>' + esc(q.answer.f) + '</b>' + esc(after) + '</i>';
  }
  v.innerHTML = (correct ? 'Correct' : saved ? 'Incorrect · streak held' : 'Incorrect') + (note ? '<small>' + note + '</small>' : '');

  document.getElementById('foot').classList.add('on');
  document.getElementById('next').focus();
  paint();
  persist();
}

function paint() {
  const toNext = (earned + 1) * LIFE_EVERY - streak;
  const pips = lives
    ? '<span class="lives' + (justEarned ? ' pop' : '') + '" title="' + lives + ' extra ' + (lives === 1 ? 'life' : 'lives') + '">' +
      '<i></i>'.repeat(Math.min(lives, 8)) + (lives > 8 ? '&times;' + lives : '') + '</span>'
    : '';
  document.getElementById('tally').innerHTML =
    '<b>' + right + '</b> / <b>' + seen + '</b> correct · streak <b>' + streak + '</b>' + pips +
    ' · <b>' + toNext + '</b> to next life';

  document.getElementById('ticks').innerHTML =
    marks.map(m => '<span class="tick ' + (m === 'hit' ? 'hit' : m === 'save' ? 'save' : 'miss') + '"></span>').join('') +
    '<span class="tick"></span>'.repeat(Math.max(0, 20 - marks.length));

  document.getElementById('hintKeys').textContent =
    'Keys ' + keys.map(k => k.toUpperCase()).join(' ') + ' to answer · ↵ to continue';
}

/* ---------- key bindings ---------- */
function renderBinds() {
  document.getElementById('binds').innerHTML = keys.map((k, i) =>
    '<li><button type="button" data-slot="' + i + '">' +
      '<span class="slot">Choice ' + (i + 1) + '</span>' +
      '<span class="cap">' + esc(k.toUpperCase()) + '</span></button></li>').join('');
  document.querySelectorAll('.binds button').forEach(b =>
    b.addEventListener('click', () => {
      listening = +b.dataset.slot;
      document.querySelectorAll('.binds button').forEach(x => x.classList.remove('listening'));
      b.classList.add('listening');
      b.querySelector('.cap').textContent = '…';
    }));
}
function say(msg, warn) {
  const n = document.getElementById('pnote');
  let s = n.querySelector('.msg');
  if (!s) { s = document.createElement('span'); s.className = 'msg'; n.prepend(s); }
  s.className = 'msg' + (warn ? ' warn' : '');
  s.textContent = msg ? msg + ' ' : '';
}
function bind(slot, k) {
  if (RESERVED.includes(k)) { say('That key is reserved.', true); return false; }
  if (k.length !== 1) { say('Pick a single character key.', true); return false; }
  const clash = keys.indexOf(k);
  if (clash > -1 && clash !== slot) { say('“' + k.toUpperCase() + '” is already choice ' + (clash + 1) + '.', true); return false; }
  keys[slot] = k;
  say('');
  return true;
}

/* ---------- controls ---------- */
function syncTabs() {
  document.querySelectorAll('.modes button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
}
document.querySelectorAll('.modes button').forEach(b => {
  b.addEventListener('click', () => { mode = b.dataset.mode; syncTabs(); persist(); render(); });
});
document.getElementById('next').addEventListener('click', render);
document.getElementById('keysBtn').addEventListener('click', () => {
  const p = document.getElementById('panel');
  p.hidden = !p.hidden;
  if (!p.hidden) p.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});
document.getElementById('defaults').addEventListener('click', () => {
  keys = DEFAULT_KEYS.slice(); listening = -1;
  say(''); renderBinds(); paint(); persist(); render();
});
document.getElementById('reset').addEventListener('click', async () => {
  seen = right = streak = lives = earned = 0; marks = []; justEarned = false;
  newDeck('def'); newDeck('cloze');
  await Store.clear(); await persist();
  paint(); render();
});

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();

  if (listening > -1) {                            // capturing a new binding
    e.preventDefault();
    const slot = listening;
    if (k === 'escape') { listening = -1; say(''); renderBinds(); return; }
    if (bind(slot, k)) { listening = -1; renderBinds(); paint(); persist(); render(); }
    else { listening = -1; renderBinds(); }
    return;
  }

  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (locked && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); render(); return; }
  if (locked) return;

  let i = keys.indexOf(k);
  if (i < 0) {                                     // 1–4 stay live unless a digit was rebound
    const d = '1234'.indexOf(k);
    if (d > -1 && !keys.includes(String(d + 1))) i = d;
  }
  if (i > -1) { e.preventDefault(); answer(i); }
});

/* ---------- boot ---------- */
(async () => {
  const s = await Store.load();
  if (s) {
    seen = s.seen | 0; right = s.right | 0; streak = s.streak | 0;
    lives = s.lives | 0; earned = s.earned | 0;
    if (Array.isArray(s.marks)) marks = s.marks.slice(-20);
    if (['def', 'cloze', 'mixed'].includes(s.mode)) mode = s.mode;
    if (Array.isArray(s.keys) && s.keys.length === 4 && new Set(s.keys).size === 4) keys = s.keys.slice();
  }
  syncTabs(); newDeck('def'); newDeck('cloze'); renderBinds(); paint(); render();
})();
</script>
</body>
</html>
