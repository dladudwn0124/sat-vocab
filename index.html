<!DOCTYPE html>
<html lang="en" data-version="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Courier+Prime:wght@400;700&family=Kalam:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
/* ===== Version 1 — the answer sheet: mint form stock, graphite bubbles, red pen ===== */
:root{
  --ground:#dde4db; --sheet:#f7f8f4; --page:#f7f8f4; --ink:#16181a; --ink-2:#5c6360; --mark:#3b4146;
  --rule:#c2ccc0; --rule-2:#e0e5dd; --red:#b8342a; --green:#20674a; --amber:#8a6a1a;
  --cover:#f7f8f4; --cover-ink:#16181a; --cover-mute:#5c6360; --tab:#eef1ea; --tab-on:#f7f8f4; --tab-line:#16181a;
  --gutter:#eef1ea; --tick:#d7ded5; --box:#f1f3ee; --spr-bg:#fbfcf9; --focus:#dfe6dc;
  --marker-radius:50%; --marker-w:30px; --marker-h:22px;
  --marker-fill:radial-gradient(ellipse at 38% 34%,#5a6167 0%,#333a3f 55%,#22282c 100%);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(20px,4vw,46px); --page-lines:none;
}
/* ===== Version 2 — the blue book: blue cover, ruled pages, red margin, ballpoint ink ===== */
/* ===== Version 2 — the chalkboard: dark slate, wooden frame, chalk in white, yellow, pink, and green ===== */
[data-version="2"]{
  --ground:#3b3f3c; --sheet:#24352f; --page:#24352f; --ink:#ecebe2; --ink-2:#a9b7ae; --mark:#f1efe4;
  --rule:#3f554c; --rule-2:#344942; --red:#f2a19c; --green:#a9dcb2; --amber:#f2d88c;
  --cover:#24352f; --cover-ink:#ecebe2; --cover-mute:#a9b7ae; --tab:#1d2c27; --tab-on:#24352f; --tab-line:#f2dc7a;
  --gutter:#24352f; --tick:#3a4f47; --box:#2b3f38; --spr-bg:#20302a; --focus:rgba(242,220,122,.22);
  --marker-radius:50%; --marker-w:30px; --marker-h:22px; --marker-text:#24352f;
  --marker-fill:radial-gradient(ellipse at 42% 40%,rgba(244,242,232,.97) 0%,rgba(236,234,224,.85) 55%,rgba(230,228,218,.6) 100%);
  --mono:"Kalam","Comic Sans MS",cursive;
  --page-lines:radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.045),transparent 45%),radial-gradient(ellipse at 82% 68%,rgba(255,255,255,.035),transparent 50%);
}
/* ===== Essential — the index card pinned to a corkboard: white card, red header rule, blue lines, typewriter ===== */
[data-version="3"]{
  --ground:#b4865a; --sheet:#fdfdfb; --page:#fdfdfb; --ink:#1c1f26; --ink-2:#5d6270; --mark:#2a4d8f;
  --rule:#d6dce8; --rule-2:#e6eaf2; --red:#c0392b; --green:#1e6b48; --amber:#8a6a1a;
  --cover:#fdfdfb; --cover-ink:#1c1f26; --cover-mute:#6a6f7c; --tab:#f3f5f9; --tab-on:#fdfdfb; --tab-line:#d0453a;
  --gutter:#fdfdfb; --tick:#e1e6ee; --box:#f3f5f9; --spr-bg:#ffffff; --focus:#dbe4f5;
  --marker-radius:2px; --marker-w:24px; --marker-h:24px; --marker-fill:#2a4d8f; --marker-text:#ffffff;
  --mono:"Courier Prime","Courier New",monospace;
  --page-lines:repeating-linear-gradient(transparent 0 29px,#dde6f3 29px 30px);
}
html[data-version="3"] body{background-color:var(--ground);
  background-image:radial-gradient(rgba(70,40,15,.28) 1px,transparent 1.6px),radial-gradient(rgba(255,235,200,.22) 1px,transparent 1.8px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
[data-version="3"] .sheet{position:relative;border:none;border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 26px 44px -22px rgba(60,30,8,.7)}
[data-version="3"] .sheet::before{content:"";position:absolute;top:-9px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 32%,#ff8d82 0%,#d23a2e 45%,#8f1d15 100%);box-shadow:0 4px 5px rgba(0,0,0,.35)}
[data-version="3"] .masthead{border-bottom:2px solid var(--tab-line);padding-top:28px}
[data-version="3"] .masthead h1{font-weight:700;letter-spacing:.14em}
[data-version="3"] .modes button{font-size:11.5px}
[data-version="3"] .modes button[aria-selected="true"]{box-shadow:inset 0 -2px 0 var(--mark)}
[data-version="3"] .gutter{border-right:1px solid var(--rule);background:transparent}
[data-version="3"] .headword{letter-spacing:0}
[data-version="3"] .bubble{border-width:1.8px}
[data-version="3"] .versions button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
[data-version="3"] .modes button[data-mode="ty"] .lg{display:none}
[data-version="3"] .modes button[data-mode="ty"] .sm{display:inline}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:clamp(12px,3vw,40px);display:flex;justify-content:center;transition:background .3s}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
ol,ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px}
.sheet{width:100%;max-width:820px;background:var(--sheet);border:1px solid var(--rule);
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 18px 44px -30px rgba(20,30,24,.5)}
[data-version="2"] .sheet{border:12px solid #7b5a3a;box-shadow:inset 0 0 0 1px #5e432b,0 24px 50px -28px rgba(0,0,0,.75)}
[data-version="2"] .headword{font-family:"Kalam",cursive;font-weight:700;text-shadow:0 0 1.5px rgba(236,235,226,.45)}
[data-version="2"] .masthead h1,[data-version="2"] .qno{font-weight:700;letter-spacing:.12em}
[data-version="2"] .spr textarea::placeholder{color:#7f9188}
[data-version="2"] .binds button.listening{background:var(--box)}
[data-version="2"] .bubble{border-style:dashed;border-width:1.8px}
[data-version="2"] .check,[data-version="2"] .next{border-radius:3px}

/* ---------- cover: masthead + version switch + tabs ---------- */
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:22px var(--pad) 16px;background:var(--cover);color:var(--cover-ink);border-bottom:2px solid var(--tab-line)}
[data-version="2"] .masthead{border-bottom:2px dashed var(--tab-line)}
.masthead h1{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin:0}
.masthead .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--cover-mute)}
.masthead .sub b{font-weight:500;color:var(--cover-ink)}
.versions{display:flex;gap:6px}
.versions button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:6px 11px;border:1px solid var(--cover-mute);color:var(--cover-mute);transition:background .15s,color .15s}
.versions button:hover{color:var(--cover-ink);border-color:var(--cover-ink)}
.versions button[aria-pressed="true"]{background:var(--cover-ink);color:var(--cover);border-color:var(--cover-ink)}
.modes{display:flex;border-bottom:1px solid var(--rule);background:var(--tab)}
.modes button{flex:1;padding:13px 6px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;
  color:var(--cover-mute);border-right:1px solid var(--rule);transition:background .15s,color .15s}
[data-version="1"] .modes button,[data-version="3"] .modes button{color:var(--ink-2)}
[data-version="2"] .modes button{border-right-color:#2f433c;font-size:12px}
.modes button:last-child{border-right:none}
.modes button:hover{color:var(--ink);background:var(--tab-on)}
.modes button[aria-selected="true"]{background:var(--tab-on);color:var(--ink);box-shadow:inset 0 -2px 0 var(--tab-line)}
.modes .sm{display:none}

/* ---------- pages ---------- */
.body{display:grid;grid-template-columns:52px 1fr;background:var(--page);background-image:var(--page-lines);background-position:0 26px}
.gutter{border-right:1px solid var(--rule);background:var(--gutter);padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:5px}
[data-version="2"] .gutter{border-right:1.5px dashed #4d6359;background:transparent}
.gutter .glabel{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--ink-2);writing-mode:vertical-rl;margin-bottom:8px;text-transform:uppercase}
.tick{width:16px;height:5px;background:var(--tick);border-radius:1px}
.tick.hit{background:var(--mark)}
.tick.miss{background:var(--red)}
.tick.save{background:var(--red);box-shadow:inset 0 0 0 1px var(--sheet)}
.form{padding:26px var(--pad) var(--pad)}

.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:14px 26px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);padding-bottom:12px;border-bottom:1px solid var(--rule-2)}
.qhead .qno{color:var(--ink);font-weight:500;text-transform:uppercase;letter-spacing:.14em}
.tally{display:flex;gap:18px;flex-wrap:wrap}
.tally b{color:var(--ink);font-weight:500}
.lives{display:inline-flex;align-items:center;gap:4px;margin-left:8px;vertical-align:-1px}
.lives i{width:13px;height:10px;border-radius:var(--marker-radius);display:inline-block;background:var(--marker-fill)}
.lives.pop i:last-of-type{animation:pop .42s cubic-bezier(.34,1.5,.64,1)}
@keyframes pop{0%{transform:scale(0) rotate(-14deg)}100%{transform:scale(1) rotate(0)}}

/* ---------- prompts ---------- */
.ask{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 12px}
.prompt{margin:0 0 30px;font-size:clamp(20px,3.1vw,26px);line-height:1.42;font-weight:400}
.prompt .pos{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-2);margin-right:.5em;vertical-align:.18em}
.headword{margin:0 0 26px;font-size:clamp(30px,5.2vw,44px);font-weight:600;letter-spacing:-.01em;line-height:1.15}
.headword .pos{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.1em;color:var(--ink-2);margin-left:14px;vertical-align:.9em}
.passage{font-size:18px;line-height:1.65;padding:16px 20px 16px 22px;margin:0 0 18px;border-left:3px solid var(--ink);background:var(--box)}
.passage .gap{border-bottom:2px solid var(--ink);padding:0 .12em;white-space:nowrap;letter-spacing:.08em}
.passage .gap.filled{border-bottom-color:var(--green);color:var(--green);font-weight:600;letter-spacing:0}
.stem{font-size:16.5px;line-height:1.5;font-weight:500;margin:0 0 22px}

/* ---------- option rows ---------- */
.options{border-top:1px solid var(--rule-2)}
.opt{border-bottom:1px solid var(--rule-2)}
.opt > button{width:100%;display:flex;align-items:flex-start;gap:16px;padding:15px 6px 15px 2px;text-align:left;transition:background .14s}
.opt > button:hover:not(:disabled){background:var(--box)}
.opt > button:disabled{cursor:default}
.bubble{flex:none;width:var(--marker-w);height:var(--marker-h);margin-top:3px;border:1.6px solid var(--mark);border-radius:var(--marker-radius);
  display:grid;place-items:center;position:relative;overflow:hidden;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--mark);transition:color .18s}
.bubble::after{content:"";position:absolute;inset:-2px;border-radius:var(--marker-radius);background:var(--marker-fill);
  transform:scale(0) rotate(-8deg);transition:transform .2s cubic-bezier(.34,1.4,.64,1)}
.opt.marked .bubble::after{transform:scale(1) rotate(-8deg)}
.opt.marked .bubble{color:var(--marker-text,var(--sheet))}
.bubble span{position:relative;z-index:1}
.main{flex:1;min-width:0}
.term{font-size:19px;font-weight:500;line-height:1.35}
.defn{font-size:18px;line-height:1.45}
.gloss{display:block;font-size:14.5px;line-height:1.5;color:var(--ink-2);margin-top:5px;max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .25s ease .05s}
.revealed .gloss{max-height:240px;opacity:1}
.gloss .owner{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2)}
.gloss .owner b{font-family:var(--serif);font-size:15px;letter-spacing:0;font-weight:500;color:var(--ink)}
.stamp{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;padding:3px 7px;margin-top:5px;opacity:0;transition:opacity .2s}
.revealed .stamp{opacity:1}
.opt.key .stamp{color:var(--green);border:1px solid var(--green)}
.opt.slip .stamp{color:var(--red);border:1px solid var(--red)}
.opt.key .term,.opt.key .defn{color:var(--green)}
.opt.slip .term,.opt.slip .defn{color:var(--red)}
.opt.slip .term{text-decoration:line-through;text-decoration-color:rgba(184,52,42,.5)}

/* ---------- typed response ---------- */
.spr{border:1.6px solid var(--mark);background:var(--spr-bg);position:relative}
.spr label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-2);padding:10px 14px 0}
.spr textarea{display:block;width:100%;border:none;background:transparent;resize:none;padding:6px 14px 14px;font-family:var(--serif);font-size:20px;line-height:1.45;color:var(--ink);min-height:74px}
.spr textarea:focus{outline:none}
.spr textarea::placeholder{color:#a9b0ab}
.spr:focus-within{box-shadow:0 0 0 3px var(--focus)}
.spr[data-state="done"]{border-color:var(--rule);background:var(--box)}
.spr[data-state="done"] textarea{color:var(--ink-2)}
.sprbar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.sprbar.done .check,.sprbar.done kbd{display:none}
.check,.next{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:11px 20px;
  border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);transition:background .15s,color .15s}
.check:hover,.next:hover{background:transparent;color:var(--ink)}
.check:disabled{opacity:.45;cursor:default}
.dunno{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:8px 4px}
.dunno:hover{color:var(--ink)}
.sprbar kbd{font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.checking{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2)}
.checking::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mark);margin-left:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}
.answer{margin-top:22px;padding:16px 18px;border-left:3px solid var(--ink);background:var(--box);display:none}
.answer.on{display:block}
.answer .d{font-size:18px;line-height:1.5}
.answer .d .pos{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-2);margin-right:.5em;vertical-align:.18em}
.answer .ex{margin:8px 0 0;font-size:15px;color:var(--ink-2);font-style:italic}
.answer .ex b{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- verdict ---------- */
.foot{display:none;margin-top:24px;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
.foot.on{display:flex}
.verdict{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;flex:1;min-width:240px}
.verdict.right{color:var(--green)}.verdict.wrong{color:var(--red)}.verdict.close{color:var(--amber)}.verdict.held{color:var(--mark)}
.verdict small{display:block;font-family:var(--serif);font-size:14.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-2);margin-top:6px;line-height:1.5}
.verdict small b{color:var(--ink);font-weight:600}
.verdict .how{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-2);display:block;margin-top:8px;text-transform:none;font-weight:400}
.verdict .over{font:inherit;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2);padding:0;margin-left:10px}
.verdict .over:hover{color:var(--ink)}
.next kbd{font:inherit;opacity:.6;margin-left:8px}

/* ---------- key panel + footer ---------- */
.panel{margin-top:26px;border:1px solid var(--rule);background:var(--box);padding:18px 20px 16px}
.panel[hidden]{display:none}
.panel h4{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;margin:0 0 14px;color:var(--ink-2)}
.binds{display:flex;gap:10px;flex-wrap:wrap}
.binds button{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 9px;border:1px solid var(--rule);background:var(--sheet);transition:border-color .15s}
.binds button:hover{border-color:var(--mark)}
.binds button.listening{border-color:var(--red);background:#fff}
.binds .slot{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ink-2)}
.binds .cap{font-family:var(--mono);font-size:12px;font-weight:600;min-width:26px;text-align:center;border-bottom:1.5px solid var(--mark);padding-bottom:1px}
.binds button.listening .cap{color:var(--red);border-bottom-color:var(--red)}
.pnote{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin:14px 0 0;max-width:56ch}
.pnote button{text-decoration:underline;text-underline-offset:3px}
.pnote button:hover{color:var(--ink)}
.warn{color:var(--red)}
.bymode{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule-2);font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-2);display:flex;gap:18px;flex-wrap:wrap}
.bymode b{color:var(--ink);font-weight:500}
.hint{margin-top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-2);display:flex;gap:18px;flex-wrap:wrap}
.hint button{font:inherit;letter-spacing:inherit;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.hint button:hover{color:var(--ink)}

@media (max-width:640px){
  body{padding:0}
  .sheet{border:none;box-shadow:none;min-height:100vh}
  .body{grid-template-columns:1fr;background-image:none}
  .gutter{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:4px;border-right:none;border-bottom:1px solid var(--rule);padding:12px var(--pad)}
  [data-version="2"] .gutter{border-right:none;border-bottom:1.5px dashed #4d6359}
  [data-version="2"] .sheet{border-width:6px}
  [data-version="3"] .sheet::before{top:8px;left:auto;right:18px;margin-left:0;width:16px;height:16px}
  [data-version="3"] .modes button{font-size:9.5px;letter-spacing:0;padding:12px 2px}
  .gutter .glabel{writing-mode:horizontal-tb;margin:0 8px 0 0}
  .tick{width:5px;height:14px}
  .term{font-size:17.5px}.defn{font-size:16.5px}
  .modes .lg{display:none}.modes .sm{display:inline}
  .modes button{padding:12px 4px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style>
</head>
<body>
<div class="sheet">
  <header class="masthead">
    <div>
      <h1 id="title">SAT Vocabulary · Answer Form</h1>
      <p class="sub"><b id="bank">0</b> words, <b id="bankEx">0</b> words-in-context items</p>
    </div>
    <div class="versions" role="group" aria-label="Version">
      <button data-v="1" aria-pressed="true">Version 1</button>
      <button data-v="2" aria-pressed="false">Version 2</button>
      <button data-v="3" aria-pressed="false">Essential</button>
    </div>
  </header>

  <nav class="modes" role="tablist" aria-label="Question type" id="modes"></nav>

  <div class="body">
    <aside class="gutter" aria-hidden="true">
      <span class="glabel">Last 20</span>
      <div id="ticks" style="display:contents"></div>
    </aside>

    <main class="form">
      <div class="qhead">
        <span class="qno" id="qno">Question 001</span>
        <span class="tally" id="tally"></span>
      </div>

      <p class="ask" id="ask"></p>
      <div id="prompt"></div>
      <ol class="options" id="options"></ol>

      <div id="typed" hidden>
        <div class="spr" id="spr">
          <label for="resp">Student-produced response</label>
          <textarea id="resp" rows="2" placeholder="What does it mean? Your own words are fine." autocomplete="off" spellcheck="true"></textarea>
        </div>
        <div class="sprbar" id="sprbar">
          <button class="check" id="check">Check answer</button>
          <kbd>↵ to check</kbd>
          <button class="dunno" id="dunno">I don't know this one</button>
          <span class="checking" id="checking" hidden>Checking</span>
        </div>
        <div class="answer" id="answer"></div>
      </div>

      <div class="foot" id="foot">
        <p class="verdict" id="verdict"></p>

o had been held in custody for the crime.","f":"exonerated"},{"w":"exorbitant","p":"adj.","d":"(adj.) excessive","s":"The hotel charged an  ____  fee for parking, more per night than a room had cost a decade earlier. Guests who had booked without reading the fine print left angry reviews.","f":"exorbitant","e":"Her  ____  praise made me blush and squirm in my seat.","ef":"exorbitant","q":1},{"w":"expedient","p":"adj.","d":"(adj.) advisable, advantageous, serving one's self-interest","s":"In his bid for reelection, the governor made an  ____  move by tabling all controversial legislation.","f":"expedient"},{"w":"expedite","p":"v.","d":"(v.) to speed up a process","t":"core463","s":"To  ____  the delivery, the supplier shipped the parts by air rather than sea, cutting the transit time from six weeks to three days. The added cost was considerable, but the assembly line, which had been idle, was running again by the weekend.","f":"expedite","q":1},{"w":"expeditious","p":"adj.","d":"(adj.) done quickly and efficiently","s":"The clinic's new procedure was  ____ : patients were seen, tested, and given results within a single afternoon rather than over a week of visits. Patients who had grown used to waiting were startled to find themselves finished by dinner.","f":"expeditious","q":1},{"w":"expiate","p":"v.","d":"(v.) to make amends for, atone","s":"To  ____  my selfishness, I gave all my profits to charity.","f":"expiate"},{"w":"explicit","p":"adj.","d":"(adj.) clearly stated","s":"The contract was  ____  about the deadline, naming the date and the hour and stating the penalty for missing it. No one who read it could later claim to have misunderstood what was required.","f":"explicit","q":1},{"w":"exploit","p":"v.","d":"(v.) to make full use of; to take unfair advantage of","t":"core463","s":"The engineers  ____  a quirk of the alloy, using its tendency to expand when heated to seal the joint without any welding. What another team might have regarded as a flaw, they turne mple was  ____ , mixing patients of different ages and conditions, which made it difficult to say whether the drug had helped any particular group. A treatment that worked for the elderly patients might have done nothing for the young ones, and no one could tell.","f":"heterogenous","q":1},{"w":"hiatus","p":"n.","d":"(n.) a break or gap in duration or continuity","s":"The  ____  in service should last two or three months-until the cable lines are repaired .","f":"hiatus"},{"w":"hierarchy","p":"n.","d":"(n.) a system with ranked groups, usually according to social, economic, or professional class","s":"Women found it very difficult to break into the upper ranks of the department's  ____ .","f":"hierarchy"},{"w":"hinder","p":"v.","d":"(v.) to create difficulties that delay or obstruct","t":"core463","s":"Excessive paperwork  ____  the relief effort; supplies sat in warehouses for days while forms were completed in triplicate. Food that could have fed a town for a week spoiled before it left the depot.","f":"hindered","q":1},{"w":"homogeneous","p":"adj.","d":"(adj.) made up of parts that are all the same kind","t":"core463|top75","s":"The forest is surprisingly  ____ , with a single species of pine covering the entire slope and almost nothing else growing beneath it. Ecologists who study the forest have counted fewer bird species in it than in a city park.","f":"homogeneous","e":"The forest was surprisingly  ____ , with a single species of pine covering the entire slope.","ef":"homogeneous","q":1},{"w":"hubris","p":"adj.","d":"(adj.) excessive pride or self-confidence","s":"The expedition's failure was attributed to its leader's  ____ : certain of his own judgment, he had dismissed the warnings of guides who knew the mountain. Had he listened, historians agree, the expedition would have turned back in time.","f":"hubris","q":1},{"w":"hyperbole","p":"n.","d":"(n.) deliberate exaggeration for effect","t":"core463","s":"The advertisement's claim that the mattress would change your life was  ____ , an exaggeration no one was expected to take literally. Readers understood that the promise was a manner of speaking rather than a guarantee.","f":"hyperbole","q":1},{"w":"hypocrisy","p":"n.","d":"(n.) pretending to believe what one does not","s":"Once the politician began passing legislation that contradicted his campaign promises, his  ____  became apparent.","f":"hypocrisy"},{"w":"hypocritical","p":"adj.","d":"(adj.) claiming standards one does not live up to","t":"core463","s":"Critics called it  ____  for the senator to champion conservation while voting to open the reserve to logging. Her defense, that the two positions were unrelated, convinced almost no one.","f":"hypocritical","q":1},{"w":"hypothesis","p":"n.","d":"(n.) a proposed explanation","s":"The team's  ____  was that the birds navigate by the stars, and they tested it by raising chicks under an artificial sky. If the birds could still find their way when the constellations were shifted, the idea would have to be abandoned.","f":"hypothesis","q":1},{"w":"hypothetical","p":"adj.","d":"(adj.) supposed or assumed true, but unproven","s":"Even though it has been celebrated by seven major newspapers, that the drug will be a success when tested in humans is still  ____ .","f":"hypothetical"},{"w":"iconoclasm","p":"n.","d":"(n.) the act of attacking or rejecting traditional beliefs","t":"sept-2026","s":"The young painters'  ____  alarmed the academy; they rejected perspective, proportion, and every rule their teachers had handed down.","f":"iconoclasm","q":1},{"w":"iconoclast","p":"n.","d":"(n.) one who attacks common beliefs or institutions","s":"An  ____  among her colleagues, the historian attacked the field's founding assumptions in a series of essays that made her both famous and unwelcome. Journals that rejected her early papers now cite them as founding texts.","f":"iconoclast","e":"Jane goes to one protest after another, but she seems to be an  ____  rather than an activist ents had no idea what he was talking about.","f":"inarticulate"},{"w":"incarnate","p":"adj.","d":"(adj.) existing in the flesh, embodied · (v.) to give human form to","s":"In the church pageant, I play the role of greed  ____ .","f":"incarnate"},{"w":"incendiary","p":"n.","d":"(n.) a person who agitates · (adj.) inflammatory, causing combustion","s":"If we catch the  ____  who screamed \"bomb\" in the middle of the soccer match, we're going to put him in jail.","f":"incendiary"},{"w":"incentive","p":"n.","d":"(n.) something that motivates a person to act","t":"research","s":"With patents protecting their products, the larger firms had little  ____  to innovate; nothing pushed them to improve what already sold. Startups that lacked patents, and had every reason to improve, did.","f":"incentive","nm":"obstacle","e":"With patents protecting their products, the larger firms had little  ____  to innovate.","ef":"incentive","q":1},{"w":"incessant","p":"adj.","d":"(adj.) unending","s":"We wanted to go outside and play, but the  ____  rain kept us indoors for two days.","f":"incessant"},{"w":"inchoate","p":"adj.","d":"(adj.) unformed or formless, in a beginning stage","s":"The country's government is still  ____  and, because it has no great tradition, quite unstable.","f":"inchoate"},{"w":"incisive","p":"adj.","d":"(adj.) clear, sharp, direct","s":"The discussion wasn't going anywhere until her  ____  comment allowed everyone to see what the true issues were.","f":"incisive"},{"w":"inclination","p":"n.","d":"(n.) a tendency, propensity","s":"Sarah has an  ____  to see every foreign film she hears about, even when she's sure that she won't like it.","f":"inclination"},{"w":"incompatible","p":"adj.","d":"(adj.) unable to exist or work together","t":"core463","s":"The two operating systems were  ____ , and files created on one could not be opened on the other without conversion. Offices that used both machines kept two copies of every document.","f":"incompatible","q":1},{"w":"incongruous","p":"adj.","d":"(adj.) out of place; not in keeping with its surroundings","t":"core463|top75","s":"A neon sign seemed  ____  above the doorway of the eighteenth-century chapel, out of keeping with everything around it. Parishioners petitioned to have it removed within the week.","f":"incongruous","e":"A neon sign seemed  ____  above the doorway of the eighteenth-century chapel.","ef":"incongruous","q":1},{"w":"inconsequential","p":"adj.","d":"(adj.) not important; too minor to affect the outcome","s":"The formatting errors were  ____ ; they did not affect a single figure, and the study's conclusions stood unchanged. Reviewers noted them, corrected them, and moved on to the substance.","f":"inconsequential","q":1},{"w":"inconspicuous","p":"adj.","d":"(adj.) not easily seen or noticed","t":"sept-2026","s":"The moth's coloring makes it  ____  against bark, so well matched to the tree that a collector can stand beside one for minutes without seeing it.","f":"inconspicuous","q":1},{"w":"incontrovertible","p":"adj.","d":"(adj.) indisputable","s":"Only stubborn Tina would attempt to disprove the  ____  laws of physics.","f":"incontrovertible"},{"w":"incorporate","p":"v.","d":"(v.) to include as part of a whole","t":"core463","s":"The revised draft  ____  the reviewers' suggestions, adding a section on limitations and shortening the discussion of methods. The reviewers, on seeing the revision, withdrew their remaining objections.","f":"incorporated","q":1},{"w":"incorrigible","p":"adj.","d":"(adj.) incapable of correction, delinquent","s":"You can buy Grandma nicotine gum all you want, but I think that after sixty-five years of smoking she's  ____ .","f":"incorrigible"},{"w":"incredulity","p":"n.","d":"(n.) an inability or unwillingness to believe something","t":"sept-2026","s":"The announcement was met with  ____ ; reporters asked the spokesperson to repeat the figure three times before anyone would write it down.","f":"incredulity","q":1},{"w":"increment", ching the end of a process, not the beginning.","f":"inevitable","e":"Once the ice shelf cracked, the collapse of the glacier behind it became  ____ .","ef":"inevitable","q":1},{"w":"inexorable","p":"adj.","d":"(adj.) incapable of being persuaded or placated","s":"Although I begged for hours, Mom was  ____  and refused to let me stay out all night after the prom.","f":"inexorable"},{"w":"inextricable","p":"adj.","d":"(adj.) hopelessly tangled or entangled","s":"Unless I look at the solution manual, I have no way of solving this  ____  problem.","f":"inextricable"},{"w":"infallible","p":"adj.","d":"(adj.) incapable of making mistakes or being wrong","s":"No instrument is  ____ , and the observatory's most trusted telescope produced a false reading in 1998 that took months to identify. Astronomers who had treated its readings as certain spent a year rechecking their conclusions.","f":"infallible","q":1},{"w":"infamy","p":"n.","d":"(n.) notoriety, extreme ill repute","s":"The  ____  of his crime will not lessen as the decades pass.","f":"infamy"},{"w":"infusion","p":"n.","d":"(n.) an injection of one substance into another; the permeation of one substance by another","s":"The  ____  of Eastern religion into Western philosophy created interesting new schools of thought.","f":"infusion"},{"w":"ingenious","p":"adj.","d":"(adj.) clever, resourceful","s":"Her  ____  use of walnuts instead of the peanuts called for by the recipe was lauded by the other garden club members who found her cake delicious.","f":"ingenious"},{"w":"ingenuous","p":"adj.","d":"(adj.) not devious; innocent and candid","s":"He must have writers, but his speeches seem so  ____  it's hard to believe he's not speaking from his own heart.","f":"ingenuous"},{"w":"inherent","p":"adj.","d":"(adj.) existing as a natural, essential part of something","t":"core463|top75","s":"Some risk is  ____  in any expedition that crosses open sea ice; it belongs to the undertaking itself and cannot be planned away. Expediti .) to introduce a microorganism, serum, or vaccine into an organism in order to increase immunity to illness; to vaccinate","s":"I've feared needles ever since I was  ____  against 37 diseases at age one; but I have also never been sick.","f":"inoculated"},{"w":"inquisitor","p":"n.","d":"(n.) one who inquires, especially in a hostile manner","s":"The  ____  was instructed to knock on every door in town in order to find the fugitive.","f":"inquisitor"},{"w":"insatiable","p":"adj.","d":"(adj.) incapable of being satisfied","s":"My  ____  appetite for melons can be a real problem in the winter.","f":"insatiable"},{"w":"insidious","p":"adj.","d":"(adj.) appealing but imperceptibly harmful, seductive","s":"Lisa's  ____  chocolate cake tastes so good but makes you feel so sick later on!","f":"insidious"},{"w":"insightful","p":"adj.","d":"(adj.) showing deep understanding","t":"core463","s":"The student's  ____  question exposed a flaw in the model that the instructor had overlooked for years. The instructor spent the following week rewriting the model and credited the student in the revision.","f":"insightful","q":1},{"w":"insinuate","p":"v.","d":"(v.) to suggest indirectly or subtly","s":"I wish Luke and Spencer would stop  ____  that my perfect report card is the result of anything other than my superior intelligence and good work habits.","f":"insinuating"},{"w":"insipid","p":"adj.","d":"(adj.) dull, boring","s":"The play was so  ____ , I fell asleep halfway through.","f":"insipid"},{"w":"insolent","p":"adj.","d":"(adj.) rude, arrogant, overbearing","s":"That celebrity is so  ____ , making fun of his fans right to their faces.","f":"insolent"},{"w":"insolvent","p":"adj.","d":"(adj.) unable to pay debts owed","s":"By the spring the company was  ____ , owing far more to its creditors than the sale of every asset could raise. The creditors, meeting in a borrowed hall, agreed to accept a fraction of what they were owed.","f":"insolvent","q":1},{"w":"instigate","p":"v.","d" e impossible.","f":"invincible","q":1},{"w":"inviolable","p":"adj.","d":"(adj.) secure from assault","s":"Nobody was ever able to break into Batman's  ____  Batcave.","f":"inviolable"},{"w":"invoke","p":"v.","d":"(v.) to call upon or appeal to as authority or support","t":"core463","s":"The speech  ____  the founders repeatedly, calling on their authority to support a policy they could not have imagined. Historians in the audience noted that the men being quoted had lived a century before the technology in question existed.","f":"invoked","q":1},{"w":"irascible","p":"adj.","d":"(adj.) easily angered","s":"At the smallest provocation, my  ____  cat will begin scratching and clawing.","f":"irascible"},{"w":"iridescent","p":"adj.","d":"(adj.) showing rainbow colors","s":"The bride's large diamond ring was  ____  in the afternoon sun.","f":"iridescent"},{"w":"irresolute","p":"adj.","d":"(adj.) uncertain; unable to decide","t":"core463","s":"Faced with conflicting advice, the governor remained  ____  for weeks, announcing one plan and then withdrawing it the next day. Advisers who had been ready to act on Monday found by Friday that there was no plan to act on.","f":"irresolute","q":1},{"w":"irreverence","p":"n.","d":"(n.) disrespect","s":"The  ____  displayed by the band that marched through the chapel disturbed many churchgoers.","f":"irreverence"},{"w":"irreverent","p":"adj.","d":"(adj.) showing a lack of respect for things usually taken seriously","t":"core463","s":"The satirical program took an  ____  approach to the ceremony, treating its solemn rituals as material for jokes. Viewers who expected respect for the occasion were offended; those who expected jokes were delighted.","f":"irreverent","q":1},{"w":"irrevocable","p":"adj.","d":"(adj.) incapable of being taken back","s":"The Bill of Rights is an  ____  part of American law.","f":"irrevocable"},{"w":"itinerant","p":"adj.","d":"(adj.) traveling from place to place","s":" ____  laborers followed the harvest nort iewers could see how a rough idea became a finished work. Hung apart, neither set would have revealed as much as the two did side by side.","f":"juxtaposed","q":1},{"w":"juxtaposition","p":"n.","d":"(n.) the act of placing two things next to each other for implicit comparison","s":"The  ____  of the mansion and the tenement in the same photograph, side by side across a narrow street, made the city's inequality impossible to ignore. Neither building, photographed alone, would have said anything about the other.","f":"juxtaposition","e":"The interior designer admired my  ____  of the yellow couch and green table.","ef":"juxtaposition","q":1},{"w":"keen","p":"adj.","d":"(adj.) sharp, eager, or highly perceptive","t":"core463","s":"The detective had a  ____  eye for detail, noticing a misaligned picture frame that everyone else in the room had walked past. The frame, it turned out, hid the safe.","f":"keen","q":1},{"w":"kindle","p":"v.","d":"(v.) to ignite; to arouse an emotion or interest","t":"core463","s":"A single lecture  ____  the student's interest in astronomy, and she spent the following decade studying variable stars. She later said she could not remember a single fact from the talk, only that she had left it wanting to know more.","f":"kindled","q":1},{"w":"kinetic","p":"adj.","d":"(adj.) relating to motion","t":"core463","s":"The sculpture is  ____ , its steel blades turning slowly in the wind so that the piece never looks the same twice. Visitors who return on a calm day find a different sculpture from the one they saw in a gale.","f":"kinetic","q":1},{"w":"knell","p":"n.","d":"(n.) the solemn sound of a bell, often indicating a death","s":"Echoing throughout our village, the funeral  ____  made the stormy day even more grim.","f":"knell"},{"w":"kudos","p":"n.","d":"(n.) praise for an achievement","s":"After the performance, the reviewers gave the opera singer  ____  for a job well done.","f":"kudos"},{"w":"laceration","p":"n.","d":"(n.) a cut, tear","s":"Because he fell off his bike into a rosebush, the paperboy's skin was covered with  ____ .","f":"lacerations"},{"w":"lackluster","p":"adj.","d":"(adj.) dull; lacking energy or brilliance","t":"core463","s":"After a  ____  first half, in which neither team managed a shot on goal, the coaches made changes that produced a lively finish. The changes at halftime, both coaches admitted, were made out of embarrassment as much as strategy.","f":"lackluster","q":1},{"w":"laconic","p":"adj.","d":"(adj.) terse in speech or writing","s":"The author's  ____  style has won him many followers who dislike wordiness.","f":"laconic"},{"w":"lament","p":"v.","d":"(v.) to mourn or express sorrow","s":"The elegy  ____  the loss of a village that was flooded when the reservoir filled, describing streets that now lie beneath forty feet of water. The poet, who had grown up there, is among the last people alive who remember the streets.","f":"laments","q":1},{"w":"languid","p":"adj.","d":"(adj.) sluggish from fatigue or weakness","s":"In the summer months, the great heat makes people  ____  and lazy.","f":"languid"},{"w":"larceny","p":"n.","d":"(n.) obtaining another's property by theft or trickery","s":"When my car was not where I had left it, I realized that I was a victim of  ____ .","f":"larceny"},{"w":"largess","p":"n.","d":"(n.) the generous giving of lavish gifts","s":"My boss demonstrated great  ____  by giving me a new car.","f":"largess"},{"w":"largesse","p":"adj.","d":"(adj.) generosity in bestowing money or gifts","s":"The library was built with the  ____  of a single donor, whose gift covered not only the construction but the first decade of operating costs. No public money was spent on it for eleven years.","f":"largesse","q":1},{"w":"latent","p":"adj.","d":"(adj.) hidden, but capable of being exposed","s":"Sigmund's dream represented his  ____  paranoid obsession with other people's shoes.","f":"latent"},{"w":"latitude","p":"n.","d":"(n.) freedom to act or make choices; also, distance north or south of the equator","t":"sept-2026","s":"The new contract gives the conductor considerable  ____  in choosing the season's program, a freedom her predecessor never had.","f":"latitude","q":1},{"w":"laud","p":"v.","d":"(v.) to praise highly","t":"core463","s":"The city council  ____  the volunteers, passing a resolution that praised their work during the flood by name. Several of the volunteers, unused to public praise, did not attend the ceremony.","f":"lauded","q":1},{"w":"laudatory","p":"adj.","d":"(adj.) expressing admiration or praise","s":"Such  ____  comments are unusual from someone who is usually so reserved in his opinions.","f":"laudatory"},{"w":"lavish","p":"adj.","d":"(adj.) given without limits · (v.) to give without limits","s":"Because they had worked very hard, the performers appreciated the critic's  ____  praise.","f":"lavish"},{"w":"legerdemain","p":"n.","d":"(n.) deception, slight-of-hand","s":"Smuggling the French plants through customs by claiming that they were fake was a remarkable bit of  ____ .","f":"legerdemain"},{"w":"lenient","p":"adj.","d":"(adj.) demonstrating tolerance or gentleness","s":"Because Professor Oglethorpe allowed his students to choose their final grades, the other teachers believed that he was excessively  ____ .","f":"lenient"},{"w":"lethargic","p":"adj.","d":"(adj.) in a state of sluggishness or apathy","s":"When Jean Claude explained to his boss that he was  ____  and didn't feel like working that day, the boss fired him.","f":"lethargic"},{"w":"levity","p":"n.","d":"(n.) lightness or humor, especially about a serious matter","t":"core463","s":"A moment of  ____  relieved the tension of the hearing when a witness's phone began playing a lullaby, and even the judge laughed. The mood, which had been tense for hours, did not fully return.","f":"levity","q":1},{"w":"liability","p":"n.","d":"(n.) something for which one is legally responsible, usually involving a disadvantage or risk · (n.) a handicap, bu r as a nuisance. His last will left everything to a fund for the preservation of the forest and nothing to any person.","f":"misanthropic","q":1},{"w":"misconstrued","p":"adj.","d":"(adj.) wrongly interpreted; taken in the wrong way","s":"The essay's irony was widely  ____ , and readers who took it literally wrote angry letters defending a position the author had been mocking. The author, bewildered, replied that she had been on their side all along.","f":"misconstrued","q":1},{"w":"mitigate","p":"v.","d":"(v.) to make less violent, alleviate","s":"The new levees did not prevent the flooding, but they  ____  it, holding the water to a few inches where earlier storms had brought several feet. Homeowners who had lost furniture in the last flood lost carpets in this one.","f":"mitigated","nm":"exacerbate","e":"When I had an awful sore throat, only warm tea would  ____  the pain.","ef":"mitigate","q":1},{"w":"moderate","p":"adj.","d":"(adj.) not extreme · (n.) one who expresses moderate opinions","s":"Luckily, the restaurant we chose had  ____  prices; none of us have any money.","f":"moderate"},{"w":"modicum","p":"n.","d":"(n.) a small amount of something","s":"Refusing to display even a  ____  of sensitivity, Henrietta announced her boss's affair in front of the entire office.","f":"modicum"},{"w":"modulate","p":"v.","d":"(v.) to pass from one state to another, especially in music","s":"The composer wrote a piece that  ____  between minor and major keys.","f":"modulated"},{"w":"mollify","p":"v.","d":"(v.) to soften in temper","s":"The police officer  ____  the angry woman by giving her a warning instead of a ticket.","f":"mollified"},{"w":"momentous","p":"adj.","d":"(adj.) important or significant, typically in a positive way","s":"The vote was  ____ , ending a system that had governed the city for two centuries and replacing it with one no one had yet tested. Residents who voted for the change admitted that they could not say what would replace what they had ended.", o listened to him.","f":"oblique"},{"w":"obliterate","p":"v.","d":"(v.) to destroy completely","t":"core463","s":"The eruption  ____  the coastal village; when the ash cleared, not even the foundations could be found. The site was rediscovered only when a survey team noticed an unnatural flatness in the hillside.","f":"obliterated","q":1},{"w":"oblivious","p":"adj.","d":"(adj.) lacking consciousness or awareness of something","s":" ____  to the burning smell emanating from the kitchen, my father did not notice that the rolls in the oven were burned until much too late.","f":"Oblivious"},{"w":"obscure","p":"adj.","d":"(adj.) unclear, partially hidden","s":"Because he was standing in the shadows, his features were  ____ .","f":"obscure"},{"w":"obsequious","p":"adj.","d":"(adj.) excessively compliant or submissive","s":"Mark acted like Janet's servant, obeying her every request in an  ____  manner.","f":"obsequious"},{"w":"obsolete","p":"adj.","d":"(adj.) no longer used, out of date","s":"With the inventions of tape decks and CDs, which both have better sound and are easier to use, eight-track players are now entirely  ____ .","f":"obsolete"},{"w":"obstacle","p":"n.","d":"(n.) something that blocks progress","t":"core463","s":"The chief  ____  facing the startup was not competition but cash, and without a new investor it could not survive the year. Rivals with worse products but deeper pockets were already gaining ground.","f":"obstacle","q":1},{"w":"obstinate","p":"adj.","d":"(adj.) not yielding easily, stubborn","s":"The  ____  child refused to leave the store until his mother bought him a candy bar.","f":"obstinate"},{"w":"obstreperous","p":"adj.","d":"(adj.) noisy, unruly","s":"Billy's  ____  behavior prompted the librarian to ask him to leave the reading room.","f":"obstreperous"},{"w":"obstruct","p":"v.","d":"(v.) to block or impede","t":"core463","s":"Fallen trees  ____  the highway for two days, and traffic was diverted along mountain roads never meant for truc t is  ____ , varying so unpredictably that its next appearance cannot be forecast to within a decade. Astronomers who want to observe it must wait for it to arrive and hope they are looking in the right direction.","f":"erratic","q":1,"e":"The comet's  ____  orbit makes its next appearance nearly impossible to predict.","ef":"erratic"},{"w":"erudite","p":"adj.","d":"(adj.) learned","s":"My Latin teacher is such an  ____  scholar that he has translated some of the most difficult and abstruse ancient poetry.","f":"erudite"},{"w":"esoteric","p":"adj.","d":"(adj.) understood by only a select few","s":"Even the most advanced students cannot understand the physicist's  ____  theories.","f":"esoteric"},{"w":"espouse","p":"v.","d":"(v.) to take up as a cause, support","s":"I love animals so much that I  ____  animal rights.","f":"espouse"},{"w":"esteemed","p":"adj.","d":"(adj.) highly respected","s":"The  ____  biologist was invited to give the commencement address, an honor the university reserves for scholars of the highest reputation. In forty years, the invitation had been extended to fewer than a dozen people.","f":"esteemed","q":1},{"w":"euphemism","p":"n.","d":"(n.) a mild word substituted for a harsh one","s":"The memo referred to the layoffs as a workforce adjustment, a  ____  that softened the news without changing it. Employees who received it understood exactly what was being adjusted.","f":"euphemism","q":1},{"w":"evanescent","p":"adj.","d":"(adj.) fleeting, momentary","s":"My joy at getting promoted was  ____  because I discovered that I would have to work much longer hours in a less friendly office.","f":"evanescent"},{"w":"evince","p":"v.","d":"(v.) to show, reveal","s":"Christopher's hand-wringing and nail-biting  ____  how nervous he is about the upcoming English test.","f":"evince"},{"w":"exasperate","p":"v.","d":"(v.) to irritate, irk","s":"George's endless complaints  ____  his roomate.","f":"exasperated"},{"w":"exculpate","p":"v.","d":"(v.) to free fro ion  ____  the man who had been held in custody for the crime.","f":"exonerated"},{"w":"exorbitant","p":"adj.","d":"(adj.) excessive","s":"The hotel charged an  ____  fee for parking, more per night than a room had cost a decade earlier. Guests who had booked without reading the fine print left angry reviews.","f":"exorbitant","q":1,"e":"Her  ____  praise made me blush and squirm in my seat.","ef":"exorbitant"},{"w":"expedient","p":"adj.","d":"(adj.) advisable, advantageous, serving one's self-interest","s":"In his bid for reelection, the governor made an  ____  move by tabling all controversial legislation.","f":"expedient"},{"w":"expedite","p":"v.","d":"(v.) to speed up a process","s":"To  ____  the delivery, the supplier shipped the parts by air rather than sea, cutting the transit time from six weeks to three days. The added cost was considerable, but the assembly line, which had been idle, was running again by the weekend.","f":"expedite","q":1},{"w":"expeditious","p":"adj.","d":"(adj.) done quickly and efficiently","s":"The clinic's new procedure was  ____ : patients were seen, tested, and given results within a single afternoon rather than over a week of visits. Patients who had grown used to waiting were startled to find themselves finished by dinner.","f":"expeditious","q":1},{"w":"expiate","p":"v.","d":"(v.) to make amends for, atone","s":"To  ____  my selfishness, I gave all my profits to charity.","f":"expiate"},{"w":"explicit","p":"adj.","d":"(adj.) clearly stated","s":"The contract was  ____  about the deadline, naming the date and the hour and stating the penalty for missing it. No one who read it could later claim to have misunderstood what was required.","f":"explicit","q":1},{"w":"exploit","p":"v.","d":"(v.) to make full use of; to take unfair advantage of","s":"The engineers  ____  a quirk of the alloy, using its tendency to expand when heated to seal the joint without any welding. What another team might have regarded as a flaw, they turned into ter with him at the post office.","ef":"fortuitous"},{"w":"foster","p":"v.","d":"(v.) to stimulate, promote, encourage","s":"To  ____  good health in the city, the mayor started a \"Get out and exercise!\" campaign.","f":"foster"},{"w":"fractious","p":"adj.","d":"(adj.) troublesome or irritable","s":"Although the child insisted he wasn't tired, his  ____  behavior-especially his decision to crush his cheese and crackers all over the floor-convinced everyone present that it was time to put him to bed.","f":"fractious"},{"w":"frank","p":"adj.","d":"(adj.) honest and direct in speech","s":"In a  ____  assessment, the director admitted that the project was over budget and behind schedule, and that neither problem was likely to be fixed. Investors who had grown used to reassurance were unsettled by the candor.","f":"frank","q":1},{"w":"fraudulent","p":"adj.","d":"(adj.) obtained or done by deception","s":"Auditors uncovered a series of  ____  transactions, invoices for work that was never done, designed to make the firm's earnings look larger than they were. The invoices were real; the work they described had simply never happened.","f":"fraudulent","q":1},{"w":"frugal","p":"adj.","d":"(adj.) thrifty, economical","s":"Richard is so  ____  that his diet consists almost exclusively of catfish and chicken liver-the two most inexpensive foods in the store.","f":"frugal"},{"w":"futile","p":"adj.","d":"(adj.) incapable of producing any useful result; pointless","s":"The rescuers' effort to reach the stranded hikers before dark proved  ____ ; the storm closed the trail long before they arrived. By the time the weather cleared, the hikers had found their own way down.","f":"futile","q":1},{"w":"galvanize","p":"v.","d":"(v.) to shock or excite into action","s":"The images of the flooded town  ____  the public, and donations that had trickled in for weeks arrived by the truckload within days. Appeals that had gone unanswered for a month were suddenly oversubscribed.","f":"galvaniz nd the water settled the argument.","f":"illusory","q":1},{"w":"immutable","p":"adj.","d":"(adj.) not changeable","s":"The laws of physics are  ____  and constant.","f":"immutable"},{"w":"impartial","p":"adj.","d":"(adj.) unbiased","s":"An  ____  jury was assembled from residents of a neighboring county, none of whom had read about the case or knew anyone involved. Neither the prosecution nor the defense challenged a single member of the panel.","f":"impartial","q":1},{"w":"impassive","p":"adj.","d":"(adj.) stoic, not susceptible to suffering","s":"Stop being so  ____ ; it's healthy to cry every now and then.","f":"impassive"},{"w":"impeccable","p":"adj.","d":"(adj.) exemplary, flawless","s":"If your grades were as  ____  as your sister's, then you too would receive a car for a graduation present.","f":"impeccable"},{"w":"impede","p":"v.","d":"(v.) to prevent or hold back","s":"Thick fog  ____  the search, keeping the helicopters grounded and limiting the boats to a crawl. Crews that would normally have covered a square mile in an hour managed a few hundred yards.","f":"impeded","q":1},{"w":"imperative","p":"adj.","d":"(adj.) necessary, pressing · (n.) a rule, command, or order","s":"It is  ____  that you have these folders organized by midday.","f":"imperative"},{"w":"imperceptible","p":"adj.","d":"(adj.) too slight to be noticed","s":"The tilt of the tower is  ____  to visitors, so slight that it can be measured only with instruments, though it grows by a fraction of an inch each decade.","f":"imperceptible","q":1},{"w":"imperious","p":"adj.","d":"(adj.) commanding, domineering","s":"The  ____  nature of your manner led me to dislike you at once.","f":"imperious"},{"w":"impetuous","p":"adj.","d":"(adj.) rash; hastily done","s":"Hilda's hasty slaying of the king was an  ____ , thoughtless action.","f":"impetuous"},{"w":"impinge","p":"v.","d":"(v.) to impact, affect, make an impression · (v.) to encroach, infringe","s":"The hail  ____  the roof, leaving large dents. often made the frat guys next door very excited.","f":"wanton"},{"w":"warrant","p":"v.","d":"(v.) to justify or call for","s":"The early results were promising enough to  ____  a larger trial, justifying an investment the sponsors had at first refused. The second study, ten times the size of the first, reached the same conclusion.","f":"warrant","q":1,"e":"The early results were promising enough to  ____  a larger trial.","ef":"warrant"},{"w":"wary","p":"n.","d":"(n.) cautious","s":"Consumers remained  ____  of large purchases during the recession, postponing cars and appliances until they felt sure of their jobs. Dealers who had stocked their lots for a normal spring found the cars still there in the fall.","f":"wary","q":1},{"w":"whimsical","p":"adj.","d":"(adj.) fanciful, full of whims","s":"The  ____  little girl liked to pretend that she was an elvin princess.","f":"whimsical"},{"w":"wily","p":"adj.","d":"(adj.) crafty, sly","s":"Though they were not the strongest of the Thundercats,  ____  Kit and Kat were definitely the most clever and full of tricks.","f":"wily"},{"w":"winsome","p":"adj.","d":"(adj.) charming, pleasing","s":"After such a long, frustrating day, I was grateful for Chris's  ____  attitude and childish naivete.","f":"winsome"},{"w":"wry","p":"n.","d":"(n.) using dry or mocking humor","s":"The memoir is told with a  ____  humor that finds something faintly ridiculous even in the author's worst misfortunes. Readers who expected a sad book found themselves laughing, and then wondering why.","f":"wry","q":1},{"w":"yoke","p":"v.","d":"(v.) to join, link","s":"We  ____  together the logs by tying a string around them.","f":"yoked"},{"w":"zealous","p":"adj.","d":"(adj.) fervent, filled with eagerness in pursuit of something","s":"If he were any more  ____  about getting his promotion, he'd practically live at the office.","f":"zealous"},{"w":"zenith","p":"n.","d":"(n.) the highest point, culminating point","s":"I was too nice to tell Nelly that she had const BY_WORD = Object.fromEntries(WORDS.map(w => [w.w, w]));
/* Each version has its own list: v1 the full bank, v2 your edited list, Essential your 128. */
let POOL = WORDS, WITH_EX = WORDS, POOL_BY = new Map(), BY_POS = {};
function usePool(v) {
  POOL = v === 3 ? ESSENTIAL : v === 2 ? V2_WORDS : WORDS;
  WITH_EX = POOL.filter(w => w.s);
  POOL_BY = new Map(POOL.map(w => [w.w, w]));
  BY_POS = {}; for (const w of POOL) (BY_POS[w.p] ||= []).push(w);
  document.getElementById('bank').textContent = POOL.length.toLocaleString();
  document.getElementById('bankEx').textContent = POOL.filter(w => w.q).length.toLocaleString();

/* ---------- the two versions ---------- */
const VERSIONS = {
  1: { title: 'SAT Vocabulary · Answer Form', modes: ['dw', 'cloze', 'mixed'], mix: ['dw', 'cloze'] },
  2: { title: 'SAT Vocabulary · Chalkboard',   modes: ['dw', 'wd', 'ty', 'mixed'], mix: ['dw', 'wd', 'ty'] },
  3: { title: 'SAT Vocabulary · Essential',   modes: ['dw', 'cloze', 'wd', 'ty', 'mixed'], mix: ['dw', 'cloze', 'wd', 'ty'] },
};
const MODE = {
  dw:    { lg: 'Definition → word', sm: 'Def → word', name: 'Definition → word' },
  cloze: { lg: 'Sentence → word',   sm: 'Sentence',   name: 'Sentence → word' },
  wd:    { lg: 'Word → definition', sm: 'Word → def', name: 'Word → definition' },
  ty:    { lg: 'Word → definition, typed', sm: 'Typed', name: 'Typed' },
  mixed: { lg: 'Mixed', sm: 'Mixed' },
};
const LIFE_EVERY = 7;
const DEFAULT_KEYS = ['a', 'b', 'c', 'd'];
const RESERVED = ['enter', ' ', 'escape', 'tab', 'shift', 'control', 'alt', 'meta'];

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const stripPos = d => d.replace(/\(([^)]+)\)\s*/g, '');
const senses = e => e.d.split(' · ').map(stripPos);

/* ---------- distractor quality ---------- */
const KEY_CACHE = new Map();
function keyWords(def) {
  if (!KEY_CACHE.has(def)) {
    const stop = new Set(['that','with','from','this','they','than','such','have','been','into','very','some','something','someone','being','which','about','other','more','used','usually']);
    KEY_CACHE.set(def, new Set((def.toLowerCase().match(/[a-z]{4,}/g) || []).filter(w => !stop.has(w))));
  }
  return KEY_CACHE.get(def);
}
function tooSimilar(a, b) {
  const A = keyWords(a.d), B = keyWords(b.d);
  if (!A.size || !B.size) return false;
  let hits = 0; for (const w of A) if (B.has(w)) hits++;
  return hits / Math.min(A.size, B.size) > 0.45;
}


/* ---------- persistence: one record, two sessions ---------- */
const Store = (() => {
  const KEY = 'sat-vocab-combined-v1';
  let mem = null;
  const ws = () => (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') ? window.storage : null;
  return {
    async load() { try { const s = ws(); if (s) { const r = await s.get(KEY); return r ? JSON.parse(r.value) : null; }
                          const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return mem; } },
    async save(o) { mem = o; try { const s = ws(); if (s) { await s.set(KEY, JSON.stringify(o)); return; } localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} },
  };
})();
const blankSession = () => ({ mode: 'dw', seen: 0, right: 0, streak: 0, lives: 0, earned: 0, marks: [], per: {} });
let version = 1, keys = DEFAULT_KEYS.slice();
let sessions = { 1: blankSession(), 2: blankSession(), 3: blankSession() };
let S = sessions[1];                                   // the live session
let decks = { all: [], ex: [] }, q = null, locked = false, listening = -1, justEarned = false, snap = null;
const persist = () => Store.save({ version, keys, sessions });
function newDeck(k) { decks[k] = shuffle((k === 'ex' ? WITH_EX : POOL).slice()); }

/* ---------- question builders ---------- */
function foilsFor(answer, n, extra) {
  const pool = (BY_POS[answer.p] || []).length >= (POOL.length < 300 ? 8 : 24) ? BY_POS[answer.p] : POOL;
  const out = [];
  const ok = c => c.w !== answer.w && !out.some(f => f.w === c.w) && !tooSimilar(c, answer) && stripPos(c.d) !== stripPos(answer.d) && (!extra || extra(c));
  if (answer.nm && POOL_BY.has(answer.nm) && ok(POOL_BY.get(answer.nm))) out.push(POOL_BY.get(answer.nm));
  for (let t = 0; out.length < n && t < 300; t++) { const c = pick(pool); if (ok(c)) out.push(c); }
  while (out.length < n) { const c = pick(POOL); if (c.w !== answer.w && !out.some(f => f.w === c.w)) out.push(c); }
  return out;
}
function build(kind) {
  const dk = kind === 'cloze' ? 'ex' : 'all';
  if (!decks[dk].length) newDeck(dk);
  const answer = decks[dk].pop();
  if (kind === 'ty') return { kind, answer, options: [] };
  const extra = kind === 'cloze' ? (c => !answer.s.toLowerCase().includes(c.w.toLowerCase().slice(0, 5))) : null;
  return { kind, answer, options: shuffle([answer, ...foilsFor(answer, 3, extra)]) };
}

/* ---------- render ---------- */
function renderTabs() {
  const nav = document.getElementById('modes');
  nav.innerHTML = VERSIONS[version].modes.map(m =>
    `<button role="tab" data-mode="${m}" aria-selected="${String(m === S.mode)}"><span class="lg">${MODE[m].lg}</span><span class="sm">${MODE[m].sm}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { S.mode = b.dataset.mode; renderTabs(); persist(); render(); }));
}
function render() {
  locked = false; snap = null;
  const kind = S.mode === 'mixed' ? pick(VERSIONS[version].mix) : S.mode;
  q = build(kind);

  document.getElementById('qno').textContent = 'Question ' + String(S.seen + 1).padStart(3, '0');
  document.getElementById('ask').textContent =
    { dw: 'Which word means', cloze: 'Words in Context', wd: 'Which definition fits', ty: 'Define this word' }[kind];

  const prompt = document.getElementById('prompt');
  if (kind === 'dw') {
    prompt.innerHTML = '<p class="prompt"><span class="pos">' + esc(q.answer.p) + '</span>' + esc(senses(q.answer)[0]) + '</p>';
  } else if (kind === 'cloze') {
    const text = esc(q.answer.s).replace(/\u2003____\u2003/, ' <span class="gap" id="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> ');
    prompt.innerHTML = '<div class="passage">' + text + '</div>' +
      '<p class="stem">Which choice completes the text with the most logical and precise word or phrase?</p>';
  } else {
    prompt.innerHTML = '<p class="headword"><span class="hl">' + esc(q.answer.w) + '</span><span class="pos">' + esc(q.answer.p) + '</span></p>';
  }

  const list = document.getElementById('options'), typed = document.getElementById('typed');
  list.innerHTML = '';
  if (kind === 'ty') {
    list.hidden = true; typed.hidden = false;
    const ta = document.getElementById('resp');
    ta.value = ''; ta.disabled = false;
    document.getElementById('spr').dataset.state = '';
    document.getElementById('check').disabled = false;
    document.getElementById('dunno').hidden = false;
    document.getElementById('checking').hidden = true;
    document.getElementById('sprbar').classList.remove('done');
    document.getElementById('answer').className = 'answer';
    setTimeout(() => ta.focus(), 30);
  } else {
    list.hidden = false; typed.hidden = true;
    q.options.forEach((o, i) => {
      const li = document.createElement('li');
      li.className = 'opt';
      const body = kind === 'wd'
        ? '<span class="defn">' + esc(stripPos(o.d)) + '</span><span class="gloss"><span class="owner">defines <b>' + esc(o.w) + '</b></span></span>'
        : '<span class="term">' + esc(o.w) + '</span><span class="gloss">' + esc(o.d) + '</span>';
      li.innerHTML = '<button type="button"><span class="bubble"><span>' + esc(keys[i].toUpperCase()) + '</span></span>' +
                     '<span class="main">' + body + '</span><span class="stamp"></span></button>';
      li.querySelector('button').addEventListener('click', () => answer(i));
      list.appendChild(li);
    });
  }
  document.getElementById('foot').classList.remove('on');
  document.getElementById('ask').scrollIntoView({ block: 'nearest' });
}

/* ---------- scoring ---------- */
function applyResult(correct) {
  let saved = false; justEarned = false;
  S.seen++; (S.per[q.kind] ||= [0, 0])[1]++;
  if (correct) {
    S.right++; S.per[q.kind][0]++; S.streak++;
    while (S.streak >= (S.earned + 1) * LIFE_EVERY) { S.earned++; S.lives++; justEarned = true; }
  } else if (S.lives > 0) { S.lives--; saved = true; }
  else { S.streak = 0; S.earned = 0; }
  S.marks.push(correct ? 'hit' : saved ? 'save' : 'miss');
  if (S.marks.length > 20) S.marks.shift();
  return saved;
}
function exampleHTML(e) {
  const src = e.e || e.s; if (!src) return '';
  const [before, after] = src.split('\u2003____\u2003');
  if (after === undefined) return '';
  return '<i>' + esc(before) + '<b>' + esc(e.e ? e.ef : e.f) + '</b>' + esc(after) + '</i>';
}
function showVerdict(correct, saved, note, cls) {
  const v = document.getElementById('verdict');
  v.className = 'verdict ' + (cls || (correct ? 'right' : saved ? 'held' : 'wrong'));
  let head = correct ? 'Correct' : saved ? 'Incorrect · streak held' : 'Incorrect';
  if (cls === 'close') head = saved ? 'Close · streak held' : 'Close';
  let extra = '';
  if (saved) extra += 'Extra life spent — your streak holds at <b>' + S.streak + '</b>, with <b>' + S.lives + '</b> left. ';
  if (justEarned) extra += 'Streak of <b>' + S.streak + '</b> — extra life earned. ';
  v.innerHTML = head + '<small>' + (note || '') + (extra ? ' ' + extra : '') + '</small>';
  document.getElementById('foot').classList.add('on');
  paint(); persist();
}
function answer(i) {
  if (locked) return;
  locked = true;
  const chosen = q.options[i];
  const correct = chosen.w === q.answer.w;
  const saved = applyResult(correct);
  document.querySelectorAll('.opt').forEach((li, n) => {
    li.classList.add('revealed');
    li.querySelector('button').disabled = true;
    if (n === i) li.classList.add('marked');
    const isKey = q.options[n].w === q.answer.w;
    if (isKey) { li.classList.add('key'); li.querySelector('.stamp').textContent = n === i ? 'Your answer · correct' : 'Correct'; }
    else if (n === i) { li.classList.add('slip'); li.querySelector('.stamp').textContent = 'Your answer'; }
  });
  if (q.kind === 'cloze') { const gap = document.getElementById('gap'); if (gap) { gap.textContent = q.answer.f; gap.classList.add('filled'); } }
  let note = correct ? '' : '<b>The answer was ' + esc(q.kind === 'wd' ? stripPos(q.answer.d) : q.answer.w) + '.</b> ';
  if (q.kind !== 'cloze') note += exampleHTML(q.answer);
  showVerdict(correct, saved, note);
  document.getElementById('next').focus();
}

const GROUP_OF = new Map();                       // word -> [group ids]
GROUPS.forEach((g, i) => g.split(/\s+/).forEach(w => (GROUP_OF.get(w) || GROUP_OF.set(w, []).get(w)).push(i)));
const gid = w => GROUPS.findIndex(g => g.split(/\s+/)[0] === w);
const ANTONYM = {};                                // negated concept -> the group it amounts to
[['hardworking','superficial'],['superficial','hardworking'],['harmful','harmless'],['harmless','harmful'],['clear','unclear'],['unclear','clear'],

 ['temporary','permanent'],['permanent','temporary'],['everywhere','rare'],['rare','abundant'],['abundant','rare'],['steady','change'],['change','steady'],

 ['hate','praise'],['fear','bold'],['improve','increase'],['reveal','shy'],['reveal','hide']].forEach(([a, b]) => { const x = gid(a), y = gid(b); if (x > -1 && y > -1) (ANTONYM['g' + x] ||= []).push('g' + y); });
function stem(w) {
  w = w.replace(/'s$/, '');
  if (w.length > 5 && (w.endsWith('er') || w.endsWith('est')) && !GROUP_OF.has(w)) {
    const base = w.replace(/e?st$|er$/, '');
    if (GROUP_OF.has(base)) w = base; else if (GROUP_OF.has(base + 'e')) w = base + 'e';
  }
  if (w.length > 6 && w.endsWith('ness')) w = w.slice(0, -4);
  if (w.length > 5 && w.endsWith('ing')) w = w.slice(0, -3);
  else if (w.length > 4 && w.endsWith('ied')) w = w.slice(0, -3) + 'y';
  else if (w.length > 4 && w.endsWith('ed')) w = w.slice(0, -2);
  else if (w.length > 4 && w.endsWith('ly')) w = w.slice(0, -2);
  else if (w.length > 4 && w.endsWith('ies')) w = w.slice(0, -3) + 'y';
  else if (w.length > 4 && /(ss|sh|ch|x|z)es$/.test(w)) w = w.slice(0, -2);
  else if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) w = w.slice(0, -1);
  return w;
}
function concepts(text) {
  const out = new Set(), negated = new Set(); let neg = false;
  for (const clause of text.toLowerCase().split(/[,;.:()]+|\bbut\b/)) {
    let scope = false;                                   // inside a clause, negation carries forward
    for (const raw of (clause.match(/[a-z][a-z'-]*/g) || [])) {
      if (NEG.has(raw)) { neg = true; scope = true; continue; }
      const add = c => {
        if (scope && ANTONYM[c]) { ANTONYM[c].forEach(a => out.add(a)); return; }   // "not thorough" means superficial
        out.add(c); if (scope) negated.add(c);
      };
      if (raw === 'less' || raw === 'lessen' || raw === 'fewer') { add('g' + gid('reduce')); continue; }
      if (raw === 'more') { add('g' + gid('increase')); continue; }
      if (STOP.has(raw)) continue;
      const s = stem(raw);
      if (STOP.has(s) || s.length < 3) continue;
      const groups = GROUP_OF.get(raw) || GROUP_OF.get(s);
      if (groups) groups.forEach(g => add('g' + g)); else add(s);
    }
  }
  return { set: out, neg, negated };
}
function localGrade(text, entry) {
  const U = concepts(text);
  if (!U.set.size) return { verdict: 'incorrect', note: 'Nothing to grade there.' };
  let best = { verdict: 'incorrect', hits: 0 };
  for (const d of senses(entry)) {
    const T = concepts(d);
    let hits = 0, flipped = 0;
    const same = (a, b) => a === b || (a[0] !== 'g' && b[0] !== 'g' && Math.min(a.length, b.length) >= 5 && (a.startsWith(b) || b.startsWith(a)));
    for (const c of U.set) {
      const m = [...T.set].find(t => same(c, t));
      if (m) { hits++; if (U.negated.has(c) !== T.negated.has(m)) flipped++; }
    }
    const prec = hits / U.set.size, rec = hits / Math.max(1, T.set.size);
    let verdict = 'incorrect';
    if (hits >= 1 && (prec >= 0.5 || rec >= 0.5 || hits >= 2)) verdict = 'correct';
    else if (hits >= 1) verdict = 'partial';
    if (hits && flipped === hits) verdict = 'incorrect';                    // matched only the negated sense
    if (hits > best.hits || (verdict === 'correct' && best.verdict !== 'correct')) best = { verdict, hits };
  }
  const note = best.verdict === 'correct' ? 'Matches the meaning.' :
               best.verdict === 'partial' ? 'In the right area, but not close enough to pin the word down.' : 'That is a different meaning.';
  return { verdict: best.verdict, note };
}
async function claudeGrade(text, entry) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 7000);
  const promptText =
    'You are grading an SAT vocabulary quiz. The student saw the word "' + entry.w + '" (' + entry.p + ') and typed a definition from memory.\n' +
    'Reference definition(s): ' + senses(entry).join(' / ') + '\n' +
    'Student wrote: "' + text.replace(/"/g, "'") + '"\n\n' +
    'Judge whether the student\'s answer expresses the same core meaning. A single accurate synonym, a paraphrase, or informal wording counts as correct; part-of-speech mismatch is fine. ' +
    'Use "partial" if the answer is in the right area but too vague to distinguish this word from others, or captures only one part of a two-part meaning. ' +
    'Use "incorrect" if the meaning is different or opposite, or the answer is a guess. ' +
    'Respond with JSON only, no prose and no code fences: {"verdict":"correct"|"partial"|"incorrect","note":"one short sentence addressed to the student"}';
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: promptText }] })
  });
  clearTimeout(t);
  if (!r.ok) throw new Error('http ' + r.status);
  const data = await r.json();
  const txt = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  const j = JSON.parse(txt.replace(/```json|```/g, '').trim());
  if (!['correct', 'partial', 'incorrect'].includes(j.verdict)) throw new Error('bad verdict');
  return { verdict: j.verdict, note: String(j.note || '').slice(0, 200) };
}

async function checkTyped(giveUp) {
  if (locked || q.kind !== 'ty') return;
  locked = true;
  const ta = document.getElementById('resp');
  const text = giveUp ? '' : ta.value.trim();
  ta.disabled = true;
  document.getElementById('spr').dataset.state = 'done';
  document.getElementById('check').disabled = true;
  document.getElementById('dunno').hidden = true;
  document.getElementById('sprbar').classList.add('done');

  let result, how;
  if (!text) { result = { verdict: 'incorrect', note: giveUp ? 'No penalty for honesty beyond the miss itself — read it and move on.' : 'Nothing typed.' }; how = ''; }
  else {
    document.getElementById('checking').hidden = false;
    try { result = await claudeGrade(text, q.answer); how = 'Checked by Claude'; }
    catch (e) { result = localGrade(text, q.answer); how = 'Checked by keyword match (offline) — open this file in claude.ai for a smarter check'; }
    document.getElementById('checking').hidden = true;
  }
  const ans = document.getElementById('answer');
  ans.innerHTML = '<p class="d"><span class="pos">' + esc(q.answer.p) + '</span>' + esc(senses(q.answer).join(' · ')) + '</p>' +
                  (exampleHTML(q.answer) ? '<p class="ex">' + exampleHTML(q.answer) + '</p>' : '');
  ans.classList.add('on');

  snap = JSON.parse(JSON.stringify(S));
  const correct = result.verdict === 'correct';
  const saved = applyResult(correct);
  const over = correct ? '<button class="over" id="over" data-to="wrong">Count it wrong instead</button>'
                       : '<button class="over" id="over" data-to="right">Count it right instead</button>';
  showVerdict(correct, saved, esc(result.note) + '<span class="how">' + esc(how) + over + '</span>', result.verdict === 'partial' ? 'close' : null);
  document.getElementById('over').addEventListener('click', override);
  document.getElementById('next').focus();
}
function override(e) {
  if (!snap) return;
  const to = e.currentTarget.dataset.to === 'right';
  sessions[version] = S = snap; snap = null;
  const saved = applyResult(to);
  showVerdict(to, saved, to ? 'Counted as correct.' : 'Counted as incorrect.');
}

/* ---------- paint ---------- */
function paint() {
  const pct = S.seen ? Math.round(S.right / S.seen * 100) : 0;
  const toNext = (S.earned + 1) * LIFE_EVERY - S.streak;
  const pips = S.lives ? '<span class="lives' + (justEarned ? ' pop' : '') + '" title="' + S.lives + ' extra ' + (S.lives === 1 ? 'life' : 'lives') + '">' +
                          '<i></i>'.repeat(Math.min(S.lives, 8)) + (S.lives > 8 ? '&times;' + S.lives : '') + '</span>' : '';
  document.getElementById('tally').innerHTML =
    '<span><b>' + S.right + '</b>/<b>' + S.seen + '</b> correct, <b>' + pct + '%</b></span>' +
    '<span>streak <b>' + S.streak + '</b>' + pips + '</span><span><b>' + toNext + '</b> to next life</span>';
  document.getElementById('ticks').innerHTML =
    S.marks.map(m => '<span class="tick ' + m + '"></span>').join('') + '<span class="tick"></span>'.repeat(Math.max(0, 20 - S.marks.length));
  document.getElementById('bymode').innerHTML = VERSIONS[version].mix.map(k => {
    const [r, n] = S.per[k] || [0, 0];
    return '<span>' + esc(MODE[k].name) + ' <b>' + r + '/' + n + '</b>' + (n ? ' (' + Math.round(r / n * 100) + '%)' : '') + '</span>';
  }).join('');
  document.getElementById('hintKeys').textContent = 'Keys ' + keys.map(k => k.toUpperCase()).join(' ') + ' to answer, ↵ to continue';
}

/* ---------- version switch ---------- */
function setVersion(v) {
  version = v; S = sessions[v];
  usePool(v); newDeck('all'); newDeck('ex');
  document.documentElement.dataset.version = String(v);
  document.getElementById('title').textContent = VERSIONS[v].title;
  document.title = VERSIONS[v].title.replace(' · ', ' — ');
  document.querySelectorAll('.versions button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
  if (!VERSIONS[v].modes.includes(S.mode)) S.mode = 'dw';
  renderTabs(); paint(); render();
}
document.querySelectorAll('.versions button').forEach(b => b.addEventListener('click', () => { if (+b.dataset.v !== version) { setVersion(+b.dataset.v); persist(); } }));

/* ---------- key bindings ---------- */
function renderBinds() {
  document.getElementById('binds').innerHTML = keys.map((k, i) =>
    '<li><button type="button" data-slot="' + i + '"><span class="slot">Choice ' + (i + 1) + '</span><span class="cap">' + esc(k.toUpperCase()) + '</span></button></li>').join('');
  document.querySelectorAll('.binds button').forEach(b => b.addEventListener('click', () => {
    listening = +b.dataset.slot;
    document.querySelectorAll('.binds button').forEach(x => x.classList.remove('listening'));
    b.classList.add('listening'); b.querySelector('.cap').textContent = '…';
    document.getElementById('resp').blur();
  }));
}
function say(msg, warn) {
  const n = document.getElementById('pnote');
  let s = n.querySelector('.msg');
  if (!s) { s = document.createElement('span'); s.className = 'msg'; n.prepend(s); }
  s.className = 'msg' + (warn ? ' warn' : ''); s.textContent = msg ? msg + ' ' : '';
}
function bind(slot, k) {
  if (RESERVED.includes(k)) { say('That key is reserved.', true); return false; }
  if (k.length !== 1) { say('Pick a single character key.', true); return false; }
  const clash = keys.indexOf(k);
  if (clash > -1 && clash !== slot) { say('“' + k.toUpperCase() + '” is already choice ' + (clash + 1) + '.', true); return false; }
  keys[slot] = k; say(''); return true;
}

  const k = e.key.toLowerCase();
  if (listening > -1) {
    e.preventDefault(); const slot = listening;
    if (k === 'escape') { listening = -1; say(''); renderBinds(); return; }
    if (bind(slot, k)) { listening = -1; renderBinds(); paint(); persist(); render(); } else { listening = -1; renderBinds(); }
    return;

  if (e.target && e.target.id === 'resp') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (i < 0) { const d = '1234'.indexOf(k); if (d > -1 && !keys.includes(String(d + 1))) i = d; }
  if (i > -1) { e.preventDefault(); answer(i); }
});
